<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>DoubleTick AI Co-pilot</title>
<style>
  @font-face { font-family: "Geist"; src: url("fonts/Geist-Variable.woff2") format("woff2"); font-weight: 100 900; }
  @font-face { font-family: "Geist Mono"; src: url("fonts/GeistMono-Variable.woff2") format("woff2"); font-weight: 100 900; }

  :root {
    --ink: #0A1A12;
    --ink-2: #3D4A44;
    --muted: #7A8781;
    --bg: #F4F8F5;
    --card: #FFFFFF;
    --line: #E1E9E4;
    --green: #007A5A;
    --green-2: #2FBF8F;
    --green-soft: #E0F2EC;
    --red: #E5484D;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1080px; background: var(--bg); }
  body { font-family: "Geist", system-ui, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; overflow: hidden; }
  .mono { font-family: "Geist Mono", ui-monospace, monospace; }

  .ad {
    position: relative; width: 1080px; height: 1080px; padding: 64px 72px;
    background:
      radial-gradient(700px 520px at 100% 0%, rgba(0,122,90,.14), transparent 60%),
      radial-gradient(600px 500px at 0% 100%, rgba(0,122,90,.08), transparent 60%),
      var(--bg);
    display: flex; flex-direction: column;
  }
  .ad::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 54px 54px;
    mask-image: radial-gradient(ellipse at 70% 60%, #000 10%, transparent 70%);
    opacity: .55;
  }
  .ad > * { position: relative; }

  .top { display: flex; align-items: center; justify-content: space-between; }
  .logo { display: block; height: 44px; width: auto; }
  .pill {
    font-size: 15px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase;
    padding: 10px 16px; border-radius: 999px; background: var(--ink); color: #fff;
    display: flex; align-items: center; gap: 10px;
  }
  .pill i { width: 8px; height: 8px; border-radius: 50%; background: var(--green-2); box-shadow: 0 0 0 4px rgba(47,191,143,.25); }

  h1 { margin-top: 60px; font-size: 76px; line-height: 1.0; letter-spacing: -0.045em; font-weight: 700; }
  h1 .less { color: var(--muted); }
  h1 em { font-style: normal; color: var(--green); }
  .sub { margin-top: 22px; font-size: 20.5px; line-height: 1.4; color: var(--ink-2); max-width: none; letter-spacing: -0.01em; }
  .sub b { color: var(--ink); font-weight: 600; }

  /* hero: human + AI companion */
  .ad > .hero { position: absolute; inset: 0; pointer-events: none; }
  .hero > * { position: absolute; }
  .disc {
    left: 150px; top: 600px; width: 540px; height: 540px; border-radius: 50%;
    background: radial-gradient(circle at 50% 40%, #DCEFE7 0%, rgba(220,239,231,.6) 45%, rgba(220,239,231,0) 70%);
  }
  .agent { left: 250px; top: 572px; width: 340px; height: 520px; }
  .links { left: 0; top: 0; width: 1080px; height: 1080px; }

  .halo { left: 560px; top: 540px; width: 200px; height: 200px; border-radius: 50%;
    background: radial-gradient(circle, rgba(47,191,143,.45) 0%, rgba(47,191,143,.14) 45%, rgba(47,191,143,0) 70%); }
  .orb {
    left: 605px; top: 585px; width: 110px; height: 110px; border-radius: 50%;
    background: radial-gradient(circle at 34% 28%, #FFFFFF 0%, #B9F0DA 14%, #4FD1A3 36%, #0E9C73 62%, #006448 88%, #00533C 100%);
    box-shadow: 0 0 0 10px rgba(47,191,143,.10), 0 0 0 22px rgba(47,191,143,.06), 0 18px 40px -8px rgba(0,122,90,.55), inset -8px -12px 24px rgba(0,60,43,.35);
    display: grid; place-items: center;
  }
  .orb svg { filter: drop-shadow(0 1px 4px rgba(0,80,58,.5)); }
  .spark { width: 6px; height: 6px; border-radius: 50%; background: var(--green-2); box-shadow: 0 0 10px 2px rgba(47,191,143,.6); }

  .tile {
    width: 78px; height: 78px; border-radius: 22px; background: #fff; border: 1px solid var(--line);
    display: grid; place-items: center;
    box-shadow: 0 1px 0 rgba(10,26,18,.03), 0 18px 36px -16px rgba(10,26,18,.3);
  }
  .tile.sm { width: 56px; height: 56px; border-radius: 17px; }
  .foot { margin-top: auto; display: flex; align-items: center; justify-content: flex-end; }
  .chans { display: flex; flex-direction: column; gap: 10px; }
  .chans .k { font-size: 13px; color: var(--muted); letter-spacing: .05em; text-transform: uppercase; }
  .chans .row { display: flex; gap: 8px; }
  .ch { font-size: 14px; font-weight: 500; padding: 8px 12px; border-radius: 10px; background: #fff; border: 1px solid var(--line); display: flex; align-items: center; gap: 7px; }
  .ch i { width: 8px; height: 8px; border-radius: 50%; }
  .cta { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
  .btn {
    background: var(--green); color: #fff; font-size: 24px; font-weight: 600; letter-spacing: -0.01em;
    padding: 18px 30px; border-radius: 16px; display: flex; align-items: center; gap: 12px;
    box-shadow: 0 14px 30px -10px rgba(0,122,90,.6);
  }
  .url { font-size: 16px; color: var(--ink-2); }
</style>
</head>
<body>
<div class="ad">
  <div class="hero">
    <div class="disc"></div>

    <!-- connecting lines -->
    <svg class="links" viewBox="0 0 1080 1080" fill="none">
      <defs>
        <linearGradient id="lg" x1="0" x2="1" y1="0" y2="0">
          <stop offset="0" stop-color="#2FBF8F" stop-opacity=".9"/>
          <stop offset="1" stop-color="#007A5A" stop-opacity=".35"/>
        </linearGradient>
      </defs>
      <g stroke="url(#lg)" stroke-width="2" stroke-linecap="round">
        <path d="M705 615 C 770 580, 790 560, 838 560"/>
        <path d="M715 645 C 790 650, 830 690, 888 690"/>
        <path d="M705 675 C 770 740, 790 820, 838 820"/>
      </g>
      <!-- companion link: orb to agent headset -->
      <path d="M612 664 C 574 694, 536 748, 500 760" stroke="#2FBF8F" stroke-width="2" stroke-dasharray="2 6" stroke-linecap="round" opacity=".9"/>
      <g fill="#2FBF8F">
        <circle cx="782" cy="569" r="4"/>
        <circle cx="822" cy="682" r="4"/>
        <circle cx="778" cy="770" r="4"/>
        <circle cx="551" cy="720" r="3"/>
      </g>
    </svg>

    <!-- agent figure -->
    <svg class="agent" viewBox="0 0 340 520" fill="none">
      <!-- neck -->
      <path d="M148 214 L 148 292 L 192 292 L 192 214 Z" fill="#C98B64"/>
      <path d="M148 226 C 160 250, 180 250, 192 226 L 192 214 L 148 214 Z" fill="#B27250" opacity=".75"/>
      <!-- body / blazer -->
      <path d="M0 520 C 0 404, 24 334, 96 308 C 120 300, 138 292, 148 286 L 192 286 C 202 292, 220 300, 244 308 C 316 334, 340 404, 340 520 Z" fill="#0F2A20"/>
      <!-- shirt + collar -->
      <path d="M146 286 L 170 352 L 194 286 Z" fill="#FFFFFF"/>
      <path d="M146 286 L 136 300 L 160 322 Z" fill="#EEF3F0"/>
      <path d="M194 286 L 204 300 L 180 322 Z" fill="#EEF3F0"/>
      <!-- lapels -->
      <path d="M146 286 L 118 302 L 152 410 L 170 352 Z" fill="#1B3D30"/>
      <path d="M194 286 L 222 302 L 188 410 L 170 352 Z" fill="#1B3D30"/>
      <!-- pocket square + pin -->
      <path d="M244 372 L 276 372 L 272 384 L 248 384 Z" fill="#2FBF8F"/>
      <g transform="translate(0,16)">
      <!-- ears -->
      <ellipse cx="112" cy="172" rx="10" ry="16" fill="#D39A72"/>
      <ellipse cx="228" cy="172" rx="10" ry="16" fill="#D39A72"/>
      <!-- head -->
      <path d="M112 160 C 112 112, 138 92, 170 92 C 202 92, 228 112, 228 160 C 228 206, 204 238, 170 238 C 136 238, 112 206, 112 160 Z" fill="#DCA57C"/>
      <!-- face -->
      <path d="M143 172 q8 -7 16 0" stroke="#2A1D17" stroke-width="3.4" stroke-linecap="round"/>
      <path d="M181 172 q8 -7 16 0" stroke="#2A1D17" stroke-width="3.4" stroke-linecap="round"/>
      <path d="M171 180 q-5 12 1 16" stroke="#B27250" stroke-width="2.4" stroke-linecap="round" opacity=".8"/>
      <path d="M158 207 q12 10 24 0" stroke="#7A3F2A" stroke-width="3" stroke-linecap="round"/>
      <!-- hair -->
      <path d="M108 170 C 100 108, 132 78, 174 78 C 222 78, 246 108, 234 168 C 230 146, 226 134, 216 124 C 194 118, 150 126, 122 142 C 116 150, 110 158, 108 170 Z" fill="#1A2420"/>
      <path d="M150 104 C 176 96, 204 100, 220 114" stroke="#2E3B36" stroke-width="3" stroke-linecap="round" opacity=".8"/>
      <!-- headset -->
      <path d="M102 172 C 98 82, 242 82, 238 172" stroke="#0A1A12" stroke-width="7" stroke-linecap="round"/>
      <rect x="96" y="150" width="22" height="44" rx="10" fill="#0A1A12"/>
      <rect x="222" y="150" width="22" height="44" rx="10" fill="#0A1A12"/>
      <rect x="232" y="160" width="6" height="24" rx="3" fill="#2FBF8F"/>
      <path d="M238 190 C 242 222, 222 230, 196 228" stroke="#0A1A12" stroke-width="5" stroke-linecap="round"/>
      <circle cx="194" cy="228" r="7" fill="#0A1A12"/>
      <circle cx="194" cy="228" r="3" fill="#2FBF8F"/>
      </g>
    </svg>

    <!-- AI orb -->
    <div class="halo"></div>
    <div class="orb">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="#fff"><path d="M12 2.5l2.1 6.4 6.4 2.1-6.4 2.1L12 19.5l-2.1-6.4L3.5 11l6.4-2.1z"/><path d="M19 15.5l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z" opacity=".85"/></svg>
    </div>
    <div class="spark" style="left:590px;top:566px"></div>
    <div class="spark" style="left:724px;top:600px;width:4px;height:4px"></div>
    <div class="spark" style="left:700px;top:708px;width:5px;height:5px"></div>

    <!-- channels -->
    <div class="tile" style="left:838px;top:521px">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#1FA855" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 20.5l1.6-5.4A8.4 8.4 0 1 1 21 11.5z"/><path d="M9 9.2c.2 2.6 2.2 4.8 5 5.4l.9-1.2 1.8.8-.4 1.3" stroke-width="1.6"/></svg>
    </div>
    <div class="tile" style="left:888px;top:651px">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#2F6FEB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3.5 7l8.5 6 8.5-6"/></svg>
    </div>
    <div class="tile" style="left:838px;top:781px">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#B7791F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>
    </div>
  </div>

  <div class="top">
    <img class="logo" src="doubletick-logo.webp" alt="DoubleTick" />
    <div class="pill mono"><i></i>AI Agent + Co-pilot</div>
  </div>

  <h1><span class="less">Less agents,</span><br/>more productive<br/><em>with AI Agent &amp; Co-pilot.</em></h1>
  <p class="sub">Empower every agent with <b>full context across WhatsApp, email, PSTN &amp; more</b> with AI&nbsp;Co-pilot.<br/>Also deploy <b>AI agents at scale</b> for hyper-personalized, human-like sales and support.</p>

  <div class="foot">
    <div class="cta">
      <div class="btn">Book a free demo
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </div>
      <div class="url mono">doubletick.io</div>
    </div>
  </div>
</div>
</body>
</html>
