<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>DoubleTick Piramal Case Study</title>
<style>
  @font-face { font-family: "Geist"; src: url("fonts/Geist-Variable.woff2") format("woff2"); font-weight: 100 900; }
  @font-face { font-family: "Geist Mono"; src: url("fonts/GeistMono-Variable.woff2") format("woff2"); font-weight: 100 900; }

  :root {
    --ink: #0A1A12;
    --ink-2: #3D4A44;
    --muted: #7A8781;
    --bg: #F4F8F5;
    --card: #FFFFFF;
    --line: #E1E9E4;
    --green: #007A5A;
    --green-2: #2FBF8F;
    --green-soft: #E0F2EC;
    --red: #E5484D;
    --red-soft: #FDECEC;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1080px; background: var(--bg); }
  body { font-family: "Geist", system-ui, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; overflow: hidden; }
  .mono { font-family: "Geist Mono", ui-monospace, monospace; }

  /* safe zone: everything that matters sits between y=130 and y=950 */
  .ad {
    position: relative; width: 1080px; height: 1080px; padding: 130px 72px;
    background:
      radial-gradient(700px 520px at 100% 0%, rgba(0,122,90,.14), transparent 60%),
      radial-gradient(600px 500px at 0% 100%, rgba(0,122,90,.08), transparent 60%),
      var(--bg);
    display: flex; flex-direction: column;
  }
  .ad::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 54px 54px;
    mask-image: radial-gradient(ellipse at 60% 70%, #000 10%, transparent 70%);
    opacity: .55;
  }
  .ad > * { position: relative; }

  .ad > .top { position: absolute; left: 72px; right: 72px; top: 52px; display: flex; align-items: center; justify-content: space-between; }
  .logo { display: block; height: 32px; width: auto; }
  .pill {
    font-size: 14px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase;
    padding: 9px 15px; border-radius: 999px; background: var(--ink); color: #fff;
    display: flex; align-items: center; gap: 10px;
  }
  .pill i { width: 8px; height: 8px; border-radius: 50%; background: var(--green-2); box-shadow: 0 0 0 4px rgba(47,191,143,.25); }

  h1 { margin-top: 20px; font-size: 70px; line-height: 1.1; letter-spacing: -0.04em; font-weight: 700; }
  h1 .drop { color: var(--muted); }
  h1 .die { color: var(--red); }
  h1 em { font-style: normal; color: var(--green); }
  .sub { margin-top: 20px; font-size: 21px; line-height: 1.42; color: var(--ink-2); letter-spacing: -0.01em; }
  .sub b { color: var(--ink); font-weight: 600; }

  /* visual: AI agent call screen reaching many users at once */
  .flow { margin: 36px 0 0; position: relative; height: 372px; }
  .flow svg { position: absolute; left: 0; top: 0; width: 936px; height: 372px; overflow: visible; }
  .phone {
    position: absolute; left: 50%; top: 0; transform: translateX(-50%); height: 372px; width: auto; display: block;
    border-radius: 28px; border: 5px solid #0E1A16; background: #0E1A16;
    box-shadow: 0 30px 60px -24px rgba(10,26,18,.55), 0 0 0 8px rgba(47,191,143,.10);
  }
  .foot { margin-top: auto; display: flex; align-items: center; justify-content: space-between; }
  .url { font-size: 16px; color: var(--ink-2); }
  .btn {
    background: var(--green); color: #fff; font-size: 22px; font-weight: 600; letter-spacing: -0.01em;
    padding: 16px 26px; border-radius: 14px; display: flex; align-items: center; gap: 12px;
    box-shadow: 0 14px 30px -10px rgba(0,122,90,.6);
  }
  .client { height: 92px; width: auto; margin: -27px -14px -27px 0; mix-blend-mode: multiply; }
</style>
</head>

    <img class="logo" src="doubletick-logo.webp" alt="DoubleTick" />
    <img class="client" src="piramal-finance-logo.png" alt="Piramal Finance" />
  </div>

  <h1>Thousands of loan<br/>conversations. <span class="drop">Manual</span><br/><span class="drop">follow-ups</span> <span class="die">couldn&rsquo;t keep up.</span></h1>
  <p class="sub"><b>Piramal Finance</b> used <b>DoubleTick AI Voice</b> to automate outreach across documents, payments, drop-offs and partner journeys, driving <b>1,343 completed conversations in a month</b>.</p>
