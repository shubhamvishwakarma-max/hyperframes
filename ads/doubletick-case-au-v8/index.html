<!doctype html>
<html lang="en"><head><meta charset="utf-8" /><title>DoubleTick AU 5,000+ Qualified Leads</title>
<style>
  @font-face { font-family: "Geist"; src: url("fonts/Geist-Variable.woff2") format("woff2"); font-weight: 100 900; }
  @font-face { font-family: "Geist Mono"; src: url("fonts/GeistMono-Variable.woff2") format("woff2"); font-weight: 100 900; }
  :root { --ink: #0A1A12; --ink-2: #3D4A44; --muted: #7A8781; --bg: #F4F8F5; --line: #E1E9E4; --green: #007A5A; --mint: #2FBF8F; --soft: #E0F2EC; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1080px; background: var(--bg); }
  body { font-family: "Geist", system-ui, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; overflow: hidden; }
  .ad { position: relative; width: 1080px; height: 1080px;
    background: radial-gradient(700px 520px at 100% 0%, rgba(0,122,90,.14), transparent 60%), radial-gradient(600px 500px at 0% 100%, rgba(0,122,90,.08), transparent 60%), var(--bg); }
  .ad > * { position: absolute; }
  .top { left: 72px; right: 72px; top: 52px; display: flex; align-items: center; justify-content: space-between; }
  .logo { height: 32px; display: block; }
  .client { height: 104px; margin: -33px -22px -33px 0; mix-blend-mode: multiply; display: block; }
  h1 { left: 72px; right: 72px; top: 150px; font-size: 64px; line-height: 1.06; letter-spacing: -0.045em; font-weight: 700; }
  h1 em { font-style: normal; color: var(--green); }
  h1 .m { color: var(--muted); }
  .sub { left: 72px; right: 72px; top: 394px; font-size: 24px; line-height: 1.4; color: var(--ink-2); letter-spacing: -0.015em; }
  .sub b { color: var(--ink); font-weight: 600; }

  /* visual flow: AI calls -> intent captured -> qualified leads -> RM follow-up */
  .vis { left: 72px; top: 548px; width: 936px; height: 290px; }
  .track { position: absolute; left: 117px; right: 117px; top: 100px; height: 6px; border-radius: 3px; background: linear-gradient(90deg, #9ED8C2, #007A5A); }
  .steps { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(4, 1fr); }
  .step { display: flex; flex-direction: column; align-items: center; gap: 18px; position: relative; }
  .num { font-size: 14px; font-weight: 700; color: var(--green); letter-spacing: .08em; height: 18px; }
  .ic { width: 132px; height: 132px; border-radius: 50%; display: grid; place-items: center; background: var(--green);
    box-shadow: 0 0 0 10px var(--bg), 0 0 0 12px rgba(0,122,90,.18), 0 22px 40px -18px rgba(0,60,43,.7); }
  .s0 .ic { background: radial-gradient(circle at 34% 28%, #9BEBCB 0%, #1FA77B 40%, #007A5A 75%, #005A42 100%); }
  .s3 .ic { background: #0B3B2C; }
  .t { font-size: 22px; font-weight: 700; letter-spacing: -0.015em; text-align: center; }
  .s2 .t::after { content: "5,000+"; display: block; width: max-content; margin: 8px auto 0; font-size: 16px; font-weight: 700; color: #fff; background: var(--green); padding: 4px 12px; border-radius: 999px; letter-spacing: 0; }
  .cta { left: 72px; top: 874px; }
  .btn { background: var(--green); color: #fff; font-size: 23px; font-weight: 600; letter-spacing: -0.01em; padding: 17px 28px; border-radius: 14px;
    display: flex; align-items: center; gap: 12px; box-shadow: 0 14px 30px -10px rgba(0,122,90,.6); }
</style></head>
<body><div class="ad">
  <div class="top"><img class="logo" src="doubletick-logo.webp" alt="DoubleTick" /><img class="client" src="au-bank-logo.png" alt="AU Small Finance Bank" /></div>

  <h1>AI made the calls.<br/><em>5,000+ opportunities unlocked</em><br/><span class="m">from dormant leads.</span></h1>
  <p class="sub"><b>DoubleTick AI Voice</b> helped <b>AU Small Finance Bank</b> identify genuine customer interest and deliver qualified prospects to its sales teams.</p>

  <div class="vis"><div class="track"></div><div class="steps"><div class="step s0"><div class="num">1</div><div class="ic"><svg width="52" height="52" viewBox="0 0 24 24" fill="#fff"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg></div><div class="t">AI calls</div></div><div class="step s1"><div class="num">2</div><div class="ic"><svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 20.5l1.6-5.4A8.4 8.4 0 1 1 21 11.5z"/><path d="M8.5 11.5h7M8.5 8.5h5"/></svg></div><div class="t">Intent captured</div></div><div class="step s2"><div class="num">3</div><div class="ic"><svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></svg></div><div class="t">Qualified leads</div></div><div class="step s3"><div class="num">4</div><div class="ic"><svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg></div><div class="t">RM follow-up</div></div></div></div>

  <div class="cta"><div class="btn">Book your Free Pilot
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div></div>
</div></body></html>
