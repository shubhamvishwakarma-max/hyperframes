<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>DoubleTick Human + AI</title>
<style>
  @font-face { font-family: "Geist"; src: url("fonts/Geist-Variable.woff2") format("woff2"); font-weight: 100 900; }
  @font-face { font-family: "Geist Mono"; src: url("fonts/GeistMono-Variable.woff2") format("woff2"); font-weight: 100 900; }

  :root {
    --ink: #0A1A12;
    --ink-2: #3D4A44;
    --muted: #7A8781;
    --bg: #F4F8F5;
    --card: #FFFFFF;
    --line: #E1E9E4;
    --green: #007A5A;
    --green-2: #2FBF8F;
    --green-soft: #E0F2EC;
    --red: #E5484D;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1080px; background: var(--bg); }
  body { font-family: "Geist", system-ui, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; overflow: hidden; }
  .mono { font-family: "Geist Mono", ui-monospace, monospace; }

  .ad {
    position: relative; width: 1080px; height: 1080px; padding: 64px 72px;
    background:
      radial-gradient(700px 520px at 100% 0%, rgba(0,122,90,.14), transparent 60%),
      radial-gradient(600px 500px at 0% 100%, rgba(0,122,90,.08), transparent 60%),
      var(--bg);
    display: flex; flex-direction: column;
  }
  .ad::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 54px 54px;
    mask-image: radial-gradient(ellipse at 70% 60%, #000 10%, transparent 70%);
    opacity: .55;
  }
  .ad > * { position: relative; }

  .top { display: flex; align-items: center; justify-content: space-between; }
  .logo { display: block; height: 44px; width: auto; }
  .pill {
    font-size: 15px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase;
    padding: 10px 16px; border-radius: 999px; background: var(--ink); color: #fff;
    display: flex; align-items: center; gap: 10px;
  }
  .pill i { width: 8px; height: 8px; border-radius: 50%; background: var(--green-2); box-shadow: 0 0 0 4px rgba(47,191,143,.25); }

  h1 { margin-top: 60px; font-size: 76px; line-height: 1.0; letter-spacing: -0.045em; font-weight: 700; }
  h1 .less { color: var(--muted); }
  h1 em { font-style: normal; color: var(--green); }
  .sub { margin-top: 22px; font-size: 20.5px; line-height: 1.4; color: var(--ink-2); max-width: none; letter-spacing: -0.01em; }
  .sub b { color: var(--ink); font-weight: 600; }

  /* hero: human + bot */
  .ad > .hero { position: absolute; inset: 0; pointer-events: none; }
  .hero > * { position: absolute; }
  .arch {
    left: 96px; top: 548px; width: 640px; height: 600px; border-radius: 320px 320px 0 0;
    background: linear-gradient(180deg, #E3F1EA 0%, #D6EBE1 100%);
    box-shadow: inset 0 0 0 1px rgba(0,122,90,.06);
  }
  .arch2 {
    left: 136px; top: 588px; width: 560px; height: 560px; border-radius: 280px 280px 0 0;
    border: 1.5px solid rgba(255,255,255,.7); border-bottom: 0;
  }
  .glow { left: 430px; top: 600px; width: 280px; height: 280px; border-radius: 50%;
    background: radial-gradient(circle, rgba(47,191,143,.28) 0%, rgba(47,191,143,0) 65%); }
  .bot { left: 398px; top: 580px; width: 320px; height: 500px; filter: drop-shadow(0 18px 26px rgba(10,26,18,.16)); }
  .human { left: 104px; top: 591px; width: 320px; height: 489px; }
  .links { left: 0; top: 0; width: 1080px; height: 1080px; }
  .tag {
    font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
    padding: 7px 11px; border-radius: 999px; background: #fff; border: 1px solid var(--line);
    display: flex; align-items: center; gap: 7px; box-shadow: 0 10px 22px -12px rgba(10,26,18,.3);
  }
  .tag i { width: 7px; height: 7px; border-radius: 50%; }
  .co {
    font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: #fff;
    padding: 7px 12px; border-radius: 999px; background: var(--green);
    display: flex; align-items: center; gap: 6px; box-shadow: 0 10px 22px -8px rgba(0,122,90,.6);
  }
  .foot { margin-top: auto; display: flex; align-items: center; justify-content: flex-end; }
  .chans { display: flex; flex-direction: column; gap: 10px; }
  .chans .k { font-size: 13px; color: var(--muted); letter-spacing: .05em; text-transform: uppercase; }
  .chans .row { display: flex; gap: 8px; }
  .ch { font-size: 14px; font-weight: 500; padding: 8px 12px; border-radius: 10px; background: #fff; border: 1px solid var(--line); display: flex; align-items: center; gap: 7px; }
  .ch i { width: 8px; height: 8px; border-radius: 50%; }
  .cta { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
  .btn {
    background: var(--green); color: #fff; font-size: 24px; font-weight: 600; letter-spacing: -0.01em;
    padding: 18px 30px; border-radius: 16px; display: flex; align-items: center; gap: 12px;
    box-shadow: 0 14px 30px -10px rgba(0,122,90,.6);
  }
  .url { font-size: 16px; color: var(--ink-2); }
</style>
</head>
<body>
<div class="ad">
  <div class="top">
    <img class="logo" src="doubletick-logo.webp" alt="DoubleTick" />
    <div class="pill mono"><i></i>AI Agent + Co-pilot</div>
  </div>

  <h1><span class="less">Less agents,</span><br/>more productive<br/><em>with AI Agent &amp; Co-pilot.</em></h1>
  <p class="sub">Empower every agent with <b>full context across WhatsApp, email, PSTN &amp; more</b> with AI&nbsp;Co-pilot.<br/>Also deploy <b>AI agents at scale</b> for hyper-personalized, human-like sales and support.</p>

  <div class="foot">
    <div class="cta">
      <div class="btn">Book a free demo
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </div>
      <div class="url mono">doubletick.io</div>
    </div>
  </div>
</div>
</body>
</html>
