<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: Inter, sans-serif;
          background: #0b0b0c;
        }
        .f05-scene {
          position: absolute;
          inset: 0;
        }
        #f05-g {
          background:
            radial-gradient(circle at 100% 95%, rgba(34, 160, 90, 0.35), transparent 55%),
            radial-gradient(circle at 0% 0%, rgba(60, 60, 64, 0.35), transparent 45%), #0b0b0c;
        }
        #f05-r {
          background:
            radial-gradient(circle at 0% 100%, rgba(150, 12, 18, 0.55), transparent 60%),
            radial-gradient(circle at 0% 0%, rgba(110, 8, 12, 0.6), transparent 40%), #0d0607;
          opacity: 0;
        }
        .f05-chart {
          position: absolute;
          left: 0;
          top: 0;
          width: 1080px;
          height: 1350px;
        }
        .f05-word {
          position: absolute;
          height: 200px;
          font-size: 180px;
          font-weight: 500;
          line-height: 1.1;
          letter-spacing: -0.045em;
          white-space: nowrap;
          opacity: 0;
        }
        #f05-volume {
          left: 80px;
          top: 230px;
          color: #8F8A84;
        }
        #f05-grows {
          left: 230px;
          top: 410px;
          color: #8F8A84;
          font-weight: 600;
        }
        #f05-control {
          left: 200px;
          top: 230px;
          width: 720px;
          text-align: right;
          color: #8F8A84;
        }
        #f05-drops {
          left: 240px;
          top: 410px;
          width: 720px;
          text-align: right;
          color: #8F8A84;
          font-weight: 600;
        }
        .f05-dot {
          position: absolute;
          left: 0;
          top: 0;
          width: 84px;
          height: 84px;
          border-radius: 50%;
        }
        #f05-gdot {
          background: #d6fbe3;
          border: 10px solid rgba(255, 255, 255, 0.28);
          box-shadow: 0 0 0 4px rgba(34, 240, 138, 0.25), 0 0 60px rgba(34, 240, 138, 0.85);
        }
        #f05-rdot {
          background: #f7b6bb;
          border: 10px solid rgba(255, 255, 255, 0.28);
          box-shadow: 0 0 0 4px rgba(242, 35, 43, 0.25), 0 0 60px rgba(242, 35, 43, 0.85);
        }
      </style>

      <div id="root" data-composition-id="f05" data-width="1080" data-height="1350">
        <!-- Beat 1: volume grows -->
        <div id="f05-g" class="f05-scene">
          <svg id="f05-gsvg" class="f05-chart" viewBox="0 0 1080 1350" aria-hidden="true">
            <defs>
              <pattern id="f05-gbars" width="54" height="1350" patternUnits="userSpaceOnUse">
                <rect x="0" y="0" width="2" height="1350" fill="rgba(34,240,138,0.16)" />
              </pattern>
              <linearGradient id="f05-gfill" x1="0" y1="490" x2="0" y2="1350" gradientUnits="userSpaceOnUse">
                <stop offset="0" stop-color="rgba(34,240,138,0.30)" />
                <stop offset="1" stop-color="rgba(34,240,138,0.04)" />
              </linearGradient>
            </defs>
            <path id="f05-garea" d="M -20 1180 C 320 1180 430 1030 600 830 C 770 630 880 510 1100 490 L 1100 1350 L -20 1350 Z" fill="url(#f05-gfill)" />
            <path id="f05-gbar" d="M -20 1180 C 320 1180 430 1030 600 830 C 770 630 880 510 1100 490 L 1100 1350 L -20 1350 Z" fill="url(#f05-gbars)" />
            <path d="M -20 1180 C 320 1180 430 1030 600 830 C 770 630 880 510 1100 490" fill="none" stroke="rgba(34,240,138,0.22)" stroke-width="10" />
            <path id="f05-gline" d="M -20 1180 C 320 1180 430 1030 600 830 C 770 630 880 510 1100 490" fill="none" stroke="#22F08A" stroke-width="16" stroke-linecap="round" />
          </svg>
          <div id="f05-gdot" class="f05-dot"></div>
          <div id="f05-volume" class="f05-word">volume</div>
          <div id="f05-grows" class="f05-word">grows</div>
        </div>

        <!-- Beat 2: control drops -->
        <div id="f05-r" class="f05-scene">
          <svg id="f05-rsvg" class="f05-chart" viewBox="0 0 1080 1350" aria-hidden="true">
            <defs>
              <pattern id="f05-rbars" width="54" height="1350" patternUnits="userSpaceOnUse">
                <rect x="0" y="0" width="2" height="1350" fill="rgba(242,35,43,0.16)" />
              </pattern>
              <linearGradient id="f05-rfill" x1="0" y1="640" x2="0" y2="1350" gradientUnits="userSpaceOnUse">
                <stop offset="0" stop-color="rgba(242,35,43,0.30)" />
                <stop offset="1" stop-color="rgba(242,35,43,0.05)" />
              </linearGradient>
            </defs>
            <path d="M -20 640 C 260 640 400 760 560 920 C 720 1080 860 1170 1100 1190 L 1100 1350 L -20 1350 Z" fill="url(#f05-rfill)" />
            <path d="M -20 640 C 260 640 400 760 560 920 C 720 1080 860 1170 1100 1190 L 1100 1350 L -20 1350 Z" fill="url(#f05-rbars)" />
            <path d="M -20 640 C 260 640 400 760 560 920 C 720 1080 860 1170 1100 1190" fill="none" stroke="rgba(242,35,43,0.22)" stroke-width="10" />
            <path id="f05-rline" d="M -20 640 C 260 640 400 760 560 920 C 720 1080 860 1170 1100 1190" fill="none" stroke="#F2232B" stroke-width="16" stroke-linecap="round" />
          </svg>
          <div id="f05-rdot" class="f05-dot"></div>
          <div id="f05-control" class="f05-word">control</div>
          <div id="f05-drops" class="f05-word">drops</div>
        </div>
      </div>

      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const word = (sel, t, col) => {
            tl.fromTo(sel, { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.28, ease: "power2.out" }, t);
            tl.to(sel, { color: col, duration: 0.35, ease: "power1.out" }, t + 0.12);
          };

          // Sample a chain of cubic beziers at equal arc length (deterministic, seek-safe keyframes)
          const sample = (segs, n) => {
            const fine = [];
            segs.forEach((s, si) => {
              for (let i = si === 0 ? 0 : 1; i <= 200; i++) {
                const t = i / 200, u = 1 - t;
                fine.push({
                  x: u * u * u * s[0] + 3 * u * u * t * s[2] + 3 * u * t * t * s[4] + t * t * t * s[6],
                  y: u * u * u * s[1] + 3 * u * u * t * s[3] + 3 * u * t * t * s[5] + t * t * t * s[7],
                });
              }
            });
            const cum = [0];
            for (let i = 1; i < fine.length; i++) cum.push(cum[i - 1] + Math.hypot(fine[i].x - fine[i - 1].x, fine[i].y - fine[i - 1].y));
            const total = cum[cum.length - 1];
            const xs = [], ys = [];
            let j = 0;
            for (let k = 0; k <= n; k++) {
              const target = (total * k) / n;
              while (j < cum.length - 2 && cum[j + 1] < target) j++;
              const span = cum[j + 1] - cum[j] || 1;
              const f = Math.min(1, Math.max(0, (target - cum[j]) / span));
              xs.push(fine[j].x + (fine[j + 1].x - fine[j].x) * f);
              ys.push(fine[j].y + (fine[j + 1].y - fine[j].y) * f);
            }
            return { xs, ys, total };
          };
          const ride = (line, dot, segs, t0, dur, ease) => {
            const p = sample(segs, 60);
            const L = Math.ceil(p.total) + 4;
            const el = document.querySelector(line);
            el.setAttribute("stroke-dasharray", L + " " + L);
            tl.fromTo(line, { attr: { "stroke-dashoffset": L } }, { attr: { "stroke-dashoffset": 0 }, duration: dur, ease }, t0);
            tl.fromTo(dot, { x: p.xs[0], y: p.ys[0], xPercent: -50, yPercent: -50, scale: 0.6 }, { scale: 1, duration: 0.25, ease: "back.out(2)" }, t0);
            tl.to(dot, { keyframes: { x: p.xs, y: p.ys, easeEach: "none" }, duration: dur, ease }, t0);
          };

          // ---------- Beat 1 (0 – 1.30): volume grows ----------
          const gSegs = [
            [-20, 1180, 320, 1180, 430, 1030, 600, 830],
            [600, 830, 770, 630, 880, 510, 1100, 490],
          ];
          tl.fromTo(["#f05-garea", "#f05-gbar"], { opacity: 0.35 }, { opacity: 1, duration: 1.2, ease: "power1.out" }, 0);
          tl.fromTo("#f05-g", { scale: 1 }, { scale: 1.04, duration: 1.3, ease: "none" }, 0);
          ride("#f05-gline", "#f05-gdot", gSegs, 0.02, 1.22, "power1.inOut");
          word("#f05-volume", 0.21, "#FFFFFF");
          word("#f05-grows", 0.66, "#22F08A");

          // ---------- Beat 2 (1.30 – 3.0): control drops ----------
          const rSegs = [
            [-20, 640, 260, 640, 400, 760, 560, 920],
            [560, 920, 720, 1080, 860, 1170, 1100, 1190],
          ];
          tl.set("#f05-g", { opacity: 0 }, 1.31);
          tl.fromTo("#f05-r", { opacity: 0 }, { opacity: 1, duration: 0.01 }, 1.3);
          tl.fromTo("#f05-r", { scale: 1.03 }, { scale: 1, duration: 1.7, ease: "none" }, 1.3);
          ride("#f05-rline", "#f05-rdot", rSegs, 1.32, 1.6, "power1.inOut");
          word("#f05-control", 1.35, "#FFFFFF");
          word("#f05-drops", 2.01, "#F2232B");

          window.__timelines["f05"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
