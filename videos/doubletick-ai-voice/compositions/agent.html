<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        [data-composition-id="agent"] {
          position: absolute;
          inset: 0;
        }
        #agent-wrap {
          width: 100%;
          height: 100%;
          display: flex;
          flex-direction: column;
          justify-content: center;
          padding: 100px 140px;
          gap: 60px;
        }
        #agent-title {
          font-size: 88px;
          font-weight: 800;
          letter-spacing: -0.03em;
          line-height: 1.05;
        }
        #agent-title span {
          color: var(--dt-green);
        }
        #agent-body {
          display: flex;
          gap: 64px;
          align-items: stretch;
        }
        #agent-card {
          width: 640px;
          flex: none;
          background: linear-gradient(180deg, var(--dt-ink-3), var(--dt-ink-2));
          border: 1px solid var(--dt-line);
          border-radius: 36px;
          padding: 44px;
          display: flex;
          flex-direction: column;
          gap: 36px;
          box-shadow: 0 40px 100px rgba(0, 0, 0, 0.45);
        }
        #agent-call-top {
          display: flex;
          align-items: center;
          gap: 24px;
        }
        #agent-avatar {
          width: 96px;
          height: 96px;
          flex: none;
          border-radius: 50%;
          background: linear-gradient(135deg, var(--dt-green), var(--dt-green-deep));
          display: grid;
          place-items: center;
          font-size: 34px;
          font-weight: 800;
          color: var(--dt-ink);
        }
        #agent-meta {
          display: flex;
          flex-direction: column;
          gap: 8px;
        }
        #agent-name {
          font-size: 36px;
          font-weight: 700;
          letter-spacing: -0.01em;
        }
        #agent-status {
          position: relative;
          height: 32px;
          font-size: 24px;
          font-weight: 500;
        }
        .agent-st {
          position: absolute;
          left: 0;
          top: 0;
          white-space: nowrap;
          display: flex;
          align-items: center;
          gap: 10px;
        }
        #agent-st-ringing {
          color: var(--dt-muted);
        }
        #agent-st-live {
          color: var(--dt-green);
          opacity: 0;
        }
        #agent-live-dot {
          width: 12px;
          height: 12px;
          border-radius: 50%;
          background: var(--dt-green);
        }
        #agent-wave {
          height: 180px;
          display: flex;
          align-items: center;
          justify-content: space-between;
          padding: 0 8px;
        }
        .agent-bar {
          width: 10px;
          height: 160px;
          border-radius: 6px;
          background: linear-gradient(180deg, var(--dt-green), var(--dt-tick-blue));
        }
        #agent-chips {
          display: flex;
          gap: 14px;
          flex-wrap: wrap;
        }
        .agent-chip {
          font-size: 24px;
          font-weight: 700;
          padding: 12px 22px;
          border-radius: 999px;
          background: rgba(37, 211, 102, 0.12);
          color: var(--dt-green);
          border: 1px solid rgba(37, 211, 102, 0.3);
          white-space: nowrap;
        }
        #agent-transcript {
          flex: 1;
          display: flex;
          flex-direction: column;
          justify-content: center;
          gap: 32px;
        }
        .agent-bubble {
          max-width: 1000px;
          font-size: 46px;
          font-weight: 500;
          line-height: 1.3;
          padding: 30px 40px;
          border-radius: 30px;
        }
        .agent-who {
          display: block;
          font-size: 22px;
          font-weight: 700;
          letter-spacing: 0.08em;
          text-transform: uppercase;
          margin-bottom: 8px;
        }
        .from-customer {
          align-self: flex-start;
          background: var(--dt-ink-3);
          border: 1px solid var(--dt-line);
          border-top-left-radius: 8px;
        }
        .from-customer .agent-who {
          color: var(--dt-muted);
        }
        .from-ai {
          align-self: flex-end;
          background: var(--dt-green);
          color: var(--dt-ink);
          border-top-right-radius: 8px;
        }
        .agent-ticks {
          display: inline-flex;
          vertical-align: middle;
          margin-left: 10px;
        }
        .agent-ticks svg {
          width: 50px;
          height: 30px;
        }
      </style>
      <div id="agent-root" data-composition-id="agent" data-width="1920" data-height="1080">
        <div id="agent-wrap">
          <h2 id="agent-title">Meet your <span>AI Voice Agent.</span></h2>
          <div id="agent-body">
            <div id="agent-card">
              <div id="agent-call-top">
                <div id="agent-avatar">AI</div>
                <div id="agent-meta">
                  <div id="agent-name">DoubleTick AI Voice</div>
                  <div id="agent-status">
                    <div class="agent-st" id="agent-st-ringing">Incoming WhatsApp call…</div>
                    <div class="agent-st" id="agent-st-live">
                      <span id="agent-live-dot"></span>Answered instantly
                    </div>
                  </div>
                </div>
              </div>
              <div id="agent-wave"></div>
              <div id="agent-chips">
                <span class="agent-chip" id="agent-chip-1">24/7</span>
                <span class="agent-chip" id="agent-chip-2">Multilingual</span>
                <span class="agent-chip" id="agent-chip-3">Human handoff</span>
              </div>
            </div>
            <div id="agent-transcript">
              <div class="agent-bubble from-customer" id="agent-b1">
                <span class="agent-who">Customer</span>Hi! Has my order shipped yet?
              </div>
              <div class="agent-bubble from-ai" id="agent-b2">
                <span class="agent-who">AI Agent</span>Yes, it arrives tomorrow. I've sent the
                tracking link on WhatsApp.<span class="agent-ticks"
                  ><svg viewBox="0 0 40 24" fill="none" aria-hidden="true">
                    <path
                      d="M2 13l6 6L20 5"
                      stroke="#0b1220"
                      stroke-width="3.5"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    />
                    <path
                      d="M16 17l2 2L30 5"
                      stroke="#0b1220"
                      stroke-width="3.5"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    /></svg
                ></span>
              </div>
              <div class="agent-bubble from-customer" id="agent-b3">
                <span class="agent-who">Customer</span>Perfect, thank you!
              </div>
            </div>
          </div>
        </div>
      </div>
      <script>
        (() => {
          // Waveform bars built once at setup (deterministic layout).
          const BAR_COUNT = 30;
          const wave = document.getElementById("agent-wave");
          for (let i = 0; i < BAR_COUNT; i++) {
            const b = document.createElement("div");
            b.className = "agent-bar";
            b.id = "agent-bar-" + i;
            wave.appendChild(b);
          }
          const bars = Array.from(wave.querySelectorAll(".agent-bar"));

          const tl = gsap.timeline({ paused: true });
          tl.fromTo(
            "#agent-title",
            { y: 30, opacity: 0 },
            { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" },
            0.05,
          );
          tl.fromTo(
            "#agent-card",
            { x: -80, opacity: 0 },
            { x: 0, opacity: 1, duration: 0.6, ease: "power3.out" },
            0.15,
          );
          tl.fromTo(
            bars,
            { scaleY: 0.06 },
            { scaleY: 0.1, duration: 0.3, ease: "sine.inOut" },
            0.3,
          );

          // Ringing -> answered
          tl.to(
            "#agent-st-ringing",
            { opacity: 0, y: -12, duration: 0.25, ease: "power2.in" },
            0.6,
          );
          tl.fromTo(
            "#agent-st-live",
            { opacity: 0, y: 12 },
            { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" },
            0.75,
          );
          tl.fromTo(
            "#agent-live-dot",
            { scale: 1 },
            { scale: 1.5, duration: 0.4, ease: "sine.inOut", yoyo: true, repeat: 5 },
            0.85,
          );

          // Deterministic "voice" waveform: chained per-bar tweens from a fixed formula.
          const STEP = 0.14;
          const W_START = 0.75;
          const W_END = 3.9;
          const steps = Math.floor((W_END - W_START) / STEP);
          const talking = (t) => (t > 0.9 && t < 1.55) || (t > 1.75 && t < 2.85) || t > 3.0;
          bars.forEach((bar, i) => {
            const center = 1 - Math.abs(i - (BAR_COUNT - 1) / 2) / (BAR_COUNT / 2);
            for (let k = 0; k < steps; k++) {
              const t = W_START + k * STEP;
              const n = Math.abs(Math.sin(i * 0.9 + k * 1.7) * Math.cos(i * 0.37 - k * 0.6));
              const amp = talking(t) ? 0.18 + 0.82 * n * (0.45 + 0.55 * center) : 0.08;
              tl.to(bar, { scaleY: amp, duration: STEP, ease: "sine.inOut" }, t);
            }
          });

          // Transcript bubbles, timed to the waveform turns
          [
            ["#agent-b1", 0.95, -40],
            ["#agent-b2", 1.75, 40],
            ["#agent-b3", 2.95, -40],
          ].forEach(([sel, at, dx]) => {
            tl.fromTo(
              sel,
              { x: dx, y: 20, opacity: 0, scale: 0.96 },
              { x: 0, y: 0, opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.6)" },
              at,
            );
          });
          ["#agent-chip-1", "#agent-chip-2", "#agent-chip-3"].forEach((c, i) => {
            tl.fromTo(
              c,
              { y: 16, opacity: 0 },
              { y: 0, opacity: 1, duration: 0.35, ease: "power3.out" },
              2.1 + i * 0.18,
            );
          });
          tl.to("#agent-wrap", { opacity: 0, y: -30, duration: 0.35, ease: "power2.in" }, 3.9);
          window.__timelines["agent"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
