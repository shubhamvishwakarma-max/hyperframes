<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>DoubleTick AI Voice — 10s promo</title>
    <script src="vendor/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Plus Jakarta Sans";
        src: url("fonts/plus-jakarta-sans-latin-500-normal.woff2") format("woff2");
        font-weight: 500;
      }
      @font-face {
        font-family: "Plus Jakarta Sans";
        src: url("fonts/plus-jakarta-sans-latin-700-normal.woff2") format("woff2");
        font-weight: 700;
      }
      @font-face {
        font-family: "Plus Jakarta Sans";
        src: url("fonts/plus-jakarta-sans-latin-800-normal.woff2") format("woff2");
        font-weight: 800;
      }

      /* DoubleTick brand tokens — every scene reads these. Swap for official hex values. */
      :root {
        --dt-ink: #0b1220;
        --dt-ink-2: #131d33;
        --dt-ink-3: #1c2945;
        --dt-line: rgba(255, 255, 255, 0.08);
        --dt-green: #25d366;
        --dt-green-deep: #128c7e;
        --dt-tick-blue: #34b7f1;
        --dt-white: #f5f7fa;
        --dt-muted: #9aa8bf;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--dt-ink);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif;
        color: var(--dt-white);
      }
      #root > div[data-composition-src] {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="10"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="bg"
        class="clip"
        data-composition-id="bg"
        data-composition-src="compositions/bg.html"
        data-start="0"
        data-duration="10"
        data-track-index="0"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="hook"
        class="clip"
        data-composition-id="hook"
        data-composition-src="compositions/hook.html"
        data-start="0"
        data-duration="2.9"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="agent"
        class="clip"
        data-composition-id="agent"
        data-composition-src="compositions/agent.html"
        data-start="2.9"
        data-duration="4.3"
        data-track-index="2"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="lockup"
        class="clip"
        data-composition-id="lockup"
        data-composition-src="compositions/lockup.html"
        data-start="7.2"
        data-duration="2.8"
        data-track-index="3"
        data-width="1920"
        data-height="1080"
      ></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
