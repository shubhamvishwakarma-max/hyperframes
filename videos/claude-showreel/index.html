<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Claude — Motion Reel 2026</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      :root {
        --bg: #100d0b;
        --surface: #1b1613;
        --fg: #f3ece2;
        --dim: #bdb3a6;
        --accent: #ff4d1f;
        --cool: #3cc8ff;
        --line: rgba(243, 236, 226, 0.1);
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--bg);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--fg);
        font-family: "Archivo Black", sans-serif;
      }
      .mono {
        font-family: "JetBrains Mono", monospace;
        font-weight: 400;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      .fill {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      [data-composition-id="main"] > div[data-composition-src] {
        position: absolute;
        inset: 0;
      }
      #el-bg {
        z-index: 1;
      }
      #el-s1 {
        z-index: 17;
      }
      #el-s2 {
        z-index: 16;
      }
      #el-s3 {
        z-index: 15;
      }
      #el-s4 {
        z-index: 14;
      }
      #el-s5 {
        z-index: 13;
      }
      #el-s6 {
        z-index: 12;
      }
      #el-s7 {
        z-index: 11;
      }
      #el-hud {
        z-index: 50;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="15"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="el-bg"
        data-composition-id="bg"
        data-composition-src="compositions/bg.html"
        data-start="0"
        data-duration="15"
        data-track-index="0"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="el-s1"
        data-composition-id="s1"
        data-composition-src="compositions/s1.html"
        data-start="0"
        data-duration="2"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="el-s2"
        data-composition-id="s2"
        data-composition-src="compositions/s2.html"
        data-start="2"
        data-duration="2.5"
        data-track-index="2"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="el-s3"
        data-composition-id="s3"
        data-composition-src="compositions/s3.html"
        data-start="4.3"
        data-duration="2.75"
        data-track-index="3"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="el-s4"
        data-composition-id="s4"
        data-composition-src="compositions/s4.html"
        data-start="7"
        data-duration="2.5"
        data-track-index="4"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="el-s5"
        data-composition-id="s5"
        data-composition-src="compositions/s5.html"
        data-start="9.4"
        data-duration="2.15"
        data-track-index="5"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="el-s6"
        data-composition-id="s6"
        data-composition-src="compositions/s6.html"
        data-start="11.5"
        data-duration="1.75"
        data-track-index="6"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="el-s7"
        data-composition-id="s7"
        data-composition-src="compositions/s7.html"
        data-start="13.2"
        data-duration="1.8"
        data-track-index="7"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="el-hud"
        data-composition-id="hud"
        data-composition-src="compositions/hud.html"
        data-start="0"
        data-duration="15"
        data-track-index="8"
        data-width="1920"
        data-height="1080"
      ></div>
    </div>
    <script>
      // Thin orchestrator: every scene owns its own timeline in compositions/.
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
