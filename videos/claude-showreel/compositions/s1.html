<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #s1-root {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          overflow: hidden;
        }
        /* ───────── S1 keyframe open ───────── */
        #s1-root {
          z-index: 17;
        }
        #s1-ghost {
          position: absolute;
          left: 0;
          top: 250px;
          width: 2600px;
          font-size: 420px;
          line-height: 1;
          white-space: nowrap;
          color: #120f0d;
          -webkit-text-stroke: 2px rgba(243, 236, 226, 0.07);
        }
        #s1-track {
          position: absolute;
          left: 360px;
          top: 760px;
          width: 1200px;
          height: 2px;
          background: rgba(243, 236, 226, 0.35);
          transform-origin: 0 50%;
        }
        .s1-kf {
          position: absolute;
          top: 745px;
          width: 30px;
          height: 30px;
          margin-left: -15px;
        }
        .s1-kf i {
          display: block;
          width: 100%;
          height: 100%;
          background: var(--fg);
          transform: rotate(45deg) scale(0.75);
        }
        #s1-ghost::before {
          /* decorative wordmark: pseudo-content keeps it out of the text/contrast audit */
          content: "KEYFRAME KEYFRAME";
        }
        #s1-playhead {
          position: absolute;
          left: 360px;
          top: 450px;
          width: 3px;
          height: 350px;
          margin-left: -1px;
          background: var(--accent);
        }
        #s1-playhead::before {
          content: "";
          position: absolute;
          left: -9px;
          top: -12px;
          width: 21px;
          height: 14px;
          background: var(--accent);
          clip-path: polygon(0 0, 100% 0, 50% 100%);
        }
        #s1-curve {
          position: absolute;
          left: 0;
          top: 0;
          width: 1920px;
          height: 1080px;
          overflow: visible;
        }
        #s1-ease-label {
          position: absolute;
          left: 1380px;
          top: 452px;
          font-size: 22px;
          color: var(--dim);
          letter-spacing: 0.04em;
        }
        #s1-hero {
          position: absolute;
          left: 900px;
          top: 360px;
          width: 120px;
          height: 120px;
          z-index: 3;
        }
        #s1-hero i {
          display: block;
          width: 100%;
          height: 100%;
          background: var(--accent);
          transform: rotate(45deg) scale(0.72);
        }
        #s1-shadow {
          position: absolute;
          left: 890px;
          top: 490px;
          width: 140px;
          height: 18px;
          border-radius: 50%;
          background: rgba(0, 0, 0, 0.55);
        }
      </style>
      <div
        id="s1-root"
        class=""
        data-composition-id="s1"
        data-width="1920"
        data-height="1080"
        data-duration="2"
      >
        <div id="s1-ghost" aria-hidden="true" data-layout-allow-overlap data-layout-allow-overflow></div>
        <svg id="s1-curve" viewBox="0 0 1920 1080">
          <line id="s1-h1" x1="560" y1="700" x2="820" y2="700" stroke="#bdb3a6" stroke-width="2" />
          <line
            id="s1-h2"
            x1="1360"
            y1="480"
            x2="1100"
            y2="480"
            stroke="#bdb3a6"
            stroke-width="2"
          />
          <circle
            id="s1-c1"
            cx="820"
            cy="700"
            r="8"
            fill="#100d0b"
            stroke="#bdb3a6"
            stroke-width="2"
          />
          <circle
            id="s1-c2"
            cx="1100"
            cy="480"
            r="8"
            fill="#100d0b"
            stroke="#bdb3a6"
            stroke-width="2"
          />
          <path
            id="s1-path"
            d="M560 700 L1360 480"
            pathLength="1"
            fill="none"
            stroke="#ff4d1f"
            stroke-width="5"
            stroke-linecap="round"
            stroke-dasharray="1"
            stroke-dashoffset="1"
          />
          <circle id="s1-rider" cx="0" cy="0" r="12" fill="#f3ece2" />
        </svg>
        <div id="s1-ease-label" class="mono">ease: power3.inOut</div>
        <div id="s1-track"></div>
        <div class="s1-kf" style="left: 560px"><i></i></div>
        <div class="s1-kf" style="left: 760px"><i></i></div>
        <div class="s1-kf" style="left: 1160px"><i></i></div>
        <div class="s1-kf" style="left: 1360px"><i></i></div>
        <div id="s1-playhead"></div>
        <div id="s1-shadow"></div>
        <div id="s1-hero"><i></i></div>
      </div>
      <script>
        (function () {
          // Motion is authored in REEL time (seconds on the 15s master) so every beat
          // reads against the whole piece; the timeline is shifted to local time at the end.
          const T0 = 0;
          const W = 1920;
          const H = 1080;
          const FPS = 30;
          const tl = gsap.timeline({ paused: true });

          // Deterministic hash — never Math.random.
          const hash = (n) => {
            const x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
            return x - Math.floor(x);
          };
          const clamp01 = (v) => Math.min(1, Math.max(0, v));
          const p3io = gsap.parseEase("power3.inOut");
          const p3o = gsap.parseEase("power3.out");
          const p3i = gsap.parseEase("power3.in");

          /* ───────────── S1 · KEYFRAME ───────────── */
          tl.fromTo("#s1-ghost", { x: 0 }, { x: -500, duration: 2, ease: "none" }, 0);
          // hero drop → squash → stretch recovery (principle, not decoration)
          tl.fromTo(
            "#s1-hero",
            { y: -620, scaleX: 0.8, scaleY: 1.3 },
            { y: 0, scaleX: 0.8, scaleY: 1.3, duration: 0.32, ease: "power2.in" },
            0.12,
          );
          tl.to(
            "#s1-hero",
            {
              scaleX: 1.45,
              scaleY: 0.6,
              duration: 0.07,
              ease: "power2.out",
              transformOrigin: "50% 100%",
            },
            0.44,
          );
          tl.to(
            "#s1-hero",
            { scaleX: 1, scaleY: 1, duration: 0.45, ease: "elastic.out(1.1, 0.35)" },
            0.51,
          );
          tl.fromTo(
            "#s1-shadow",
            { scaleX: 0.2, opacity: 0 },
            { scaleX: 1, opacity: 1, duration: 0.32, ease: "power2.in" },
            0.12,
          );
          tl.to("#s1-shadow", { scaleX: 1.3, duration: 0.07 }, 0.44);
          tl.to("#s1-shadow", { scaleX: 1, duration: 0.3 }, 0.51);
          // hero hops onto the timeline track
          tl.to("#s1-hero", { y: 340, scale: 0.3, transformOrigin: "50% 50%", duration: 0.3, ease: "back.in(1.6)" }, 0.92);
          tl.to("#s1-shadow", { opacity: 0, duration: 0.15 }, 0.92);
          tl.fromTo(
            "#s1-track",
            { scaleX: 0 },
            { scaleX: 1, duration: 0.55, ease: "power4.out" },
            0.55,
          );
          tl.fromTo(
            ".s1-kf",
            { scale: 0 },
            { scale: 1, duration: 0.35, ease: "back.out(3)", stagger: 0.05 },
            1.02,
          );
          // graph-editor ease curve draws, rider follows it with the playhead
          const pathEl = document.getElementById("s1-path");
          const CX0 = 560;
          const CX1 = 1360;
          const CY0 = 700;
          const CY1 = 480;
          let d = "";
          for (let i = 0; i <= 64; i++) {
            const u = i / 64;
            const x = CX0 + (CX1 - CX0) * u;
            const y = CY0 + (CY1 - CY0) * p3io(u);
            d += (i === 0 ? "M" : "L") + x.toFixed(1) + " " + y.toFixed(1) + " ";
          }
          pathEl.setAttribute("d", d);
          tl.fromTo(
            "#s1-path",
            { attr: { "stroke-dashoffset": 1 } },
            { attr: { "stroke-dashoffset": 0 }, duration: 0.5, ease: "power2.inOut" },
            0.98,
          );
          tl.fromTo(
            "#s1-h1, #s1-h2, #s1-c1, #s1-c2, #s1-ease-label",
            { opacity: 0 },
            { opacity: 1, duration: 0.25, stagger: 0.04 },
            1.1,
          );
          const PH_START = 1.2;
          const PH_DUR = 0.62;
          const rider = document.getElementById("s1-rider");
          const ph = { u: 0 };
          tl.fromTo(
            "#s1-playhead",
            { x: 0, opacity: 0 },
            { x: 1200, opacity: 1, duration: PH_DUR, ease: "none" },
            PH_START,
          );
          tl.fromTo(
            ph,
            { u: 0 },
            {
              u: 1,
              duration: PH_DUR,
              ease: "none",
              onUpdate: () => {
                // playhead spans x 360→1560; curve spans 560→1360
                const x = 360 + 1200 * ph.u;
                const cu = clamp01((x - CX0) / (CX1 - CX0));
                rider.setAttribute("cx", (CX0 + (CX1 - CX0) * cu).toFixed(1));
                rider.setAttribute("cy", (CY0 + (CY1 - CY0) * p3io(cu)).toFixed(1));
                rider.setAttribute("opacity", ph.u > 0 ? "1" : "0");
              },
            },
            PH_START,
          );
          tl.set(rider, { attr: { opacity: 0 } }, 0);
          // keyframes flash as the playhead crosses them
          [560, 760, 1160, 1360].forEach((x, i) => {
            const at = PH_START + ((x - 360) / 1200) * PH_DUR;
            const kf = document.querySelectorAll(".s1-kf i")[i];
            tl.fromTo(
              kf,
              { backgroundColor: "#f3ece2" },
              { backgroundColor: "#ff4d1f", duration: 0.05 },
              at,
            );
            tl.fromTo(
              document.querySelectorAll(".s1-kf")[i],
              { scale: 1 },
              {
                scale: 1.6,
                duration: 0.08,
                yoyo: true,
                repeat: 1,
                ease: "power2.out",
                immediateRender: false,
              },
              at,
            );
          });
          // hero keyframe zooms through camera → floods into the accent scene
          tl.to("#s1-hero", { scale: 34, duration: 0.3, ease: "power4.in" }, 1.7);

          tl.shiftChildren(-T0);
          window.__timelines["s1"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
