      <script>
        (function () {
          // Motion is authored in REEL time (seconds on the 15s master) so every beat
          // reads against the whole piece; the timeline is shifted to local time at the end.
          const T0 = 7;
          const W = 1920;
          const H = 1080;
          const FPS = 30;
          const tl = gsap.timeline({ paused: true });

          // Deterministic hash — never Math.random.
          const hash = (n) => {
            const x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
            return x - Math.floor(x);
          };
          const clamp01 = (v) => Math.min(1, Math.max(0, v));
          const p3io = gsap.parseEase("power3.inOut");
          const p3o = gsap.parseEase("power3.out");
          const p3i = gsap.parseEase("power3.in");

          /* ───────────── S4 · RANGE ───────────── */
          // camera: start inside panel 01, pull back to reveal all four disciplines at once
          const ZS = 1.9; // zoomed: panel 01 fills the frame
          const FS = 0.86; // resting: grid clears the HUD margins
          const zx = 960 - 490 * ZS;
          const zy = 540 - 280 * ZS;
          tl.set("#s4-world", { x: zx, y: zy, scale: ZS }, T0);
          tl.to("#s4-world", { x: 960 * (1 - FS), y: 540 * (1 - FS), scale: FS, duration: 0.75, ease: "power3.inOut" }, 7.3);
          // type ticker (stepped vertical spring)
          [7.35, 7.8, 8.25, 8.7].forEach((at, i) => {
            tl.fromTo(
              "#p1-col",
              { y: -140 * i },
              {
                y: -140 * (i + 1),
                duration: 0.3,
                ease: "back.inOut(1.6)",
                immediateRender: i === 0,
              },
              at,
            );
          });
          tl.fromTo("#p1-sub", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 7.05);
          // 3d cube
          tl.fromTo(
            "#p2-cube",
            { rotationX: -24, rotationY: 20 },
            { rotationX: 336, rotationY: 290, duration: 2.5, ease: "power1.inOut" },
            7.0,
          );
          tl.fromTo(
            "#p2-floor",
            { scaleX: 0.7, opacity: 0.6 },
            { scaleX: 1.1, opacity: 1, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 3 },
            7.0,
          );
          // data bars + counter
          tl.fromTo(
            "#p3-bars .bar",
            { scaleY: 0 },
            { scaleY: 1, duration: 0.5, ease: "back.out(1.7)", stagger: 0.06 },
            7.55,
          );
          const cnt = { v: 0 };
          const numEl = document.getElementById("p3-num");
          tl.fromTo(
            cnt,
            { v: 0 },
            {
              v: 60,
              duration: 0.9,
              ease: "power2.out",
              onUpdate: () => (numEl.textContent = String(Math.round(cnt.v))),
            },
            7.55,
          );
          tl.fromTo(
            "#p3-num",
            { scale: 0.7 },
            { scale: 1, duration: 0.9, ease: "power2.out", transformOrigin: "100% 50%" },
            7.55,
          );
          // ui: cursor flips the toggle, then presses render
          tl.fromTo(
            "#p4-cursor",
            { x: 700, y: 420 },
            { x: 214, y: 236, duration: 0.5, ease: "power3.inOut" },
            7.45,
          );
          tl.to(
            "#p4-cursor",
            { scale: 0.85, duration: 0.06, yoyo: true, repeat: 1, transformOrigin: "10% 10%" },
            7.95,
          );
          tl.to("#p4-knob", { x: 72, duration: 0.3, ease: "back.out(2.4)" }, 8.0);
          tl.to("#p4-toggle-on", { opacity: 1, duration: 0.18 }, 8.0);
          tl.fromTo("#p4-toggle-label", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 8.05);
          tl.to("#p4-cursor", { x: 598, y: 232, duration: 0.42, ease: "power3.inOut" }, 8.2);
          tl.to(
            "#p4-cursor",
            { scale: 0.85, duration: 0.06, yoyo: true, repeat: 1, transformOrigin: "10% 10%" },
            8.64,
          );
          tl.to(
            "#p4-btn",
            { scale: 0.93, duration: 0.07, yoyo: true, repeat: 1, ease: "power2.out" },
            8.64,
          );
          tl.fromTo(
            "#p4-ripple",
            { scale: 0.3, opacity: 0.9 },
            { scale: 3.2, opacity: 0, duration: 0.45, ease: "power2.out" },
            8.66,
          );
          tl.fromTo(
            "#p4-btn-fill",
            { scaleX: 0 },
            { scaleX: 1, duration: 0.45, ease: "power1.inOut" },
            8.72,
          );
          // outro: panels tumble away into depth
          tl.to(
            ["#p1", "#p2", "#p3", "#p4"],
            {
              rotationX: -75,
              z: -900,
              y: 260,
              opacity: 0,
              duration: 0.38,
              ease: "power3.in",
              stagger: 0.04,
            },
            9.08,
          );

          tl.shiftChildren(-T0);
          window.__timelines["s4"] = tl;
        })();
