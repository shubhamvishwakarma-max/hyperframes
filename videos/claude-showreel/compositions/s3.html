<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #s3-root {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          overflow: hidden;
        }
        /* ───────── S3 wave field ───────── */
        #s3-root {
          z-index: 15;
        }
        #s3-stage {
          perspective: 1300px;
          perspective-origin: 50% 40%;
        }
        #s3-plane {
          position: absolute;
          left: -192px;
          top: -164px;
          width: 2304px;
          height: 1408px;
          transform-style: preserve-3d;
        }
        .dot {
          position: absolute;
          left: 0;
          top: 0;
          width: 10px;
          height: 10px;
          margin: -5px 0 0 -5px;
          border-radius: 50%;
          background: var(--fg);
        }
        #s3-copy {
          position: absolute;
          left: 120px;
          bottom: 170px;
        }
        #s3-head {
          display: block;
          font-size: 150px;
          line-height: 0.92;
          letter-spacing: -0.03em;
          color: var(--fg);
          text-shadow: 0 6px 40px rgba(16, 13, 11, 0.9);
        }
        #s3-eq {
          display: block;
          margin-top: 26px;
          font-size: 30px;
          color: var(--fg);
          letter-spacing: 0.02em;
        }
        #s3-eq b {
          color: var(--accent);
          font-weight: 700;
        }
        #s3-morph {
          position: absolute;
          left: 105px;
          top: 84px;
          width: 1710px;
          height: 912px;
          background: var(--accent);
          opacity: 0;
        }
      </style>
      <div
        id="s3-root"
        class=""
        data-composition-id="s3"
        data-width="1920"
        data-height="1080"
        data-duration="2.75"
      >
        <div id="s3-stage" class="fill">
          <div id="s3-plane" data-layout-allow-overflow></div>
        </div>
        <div id="s3-copy">
          <span id="s3-head">MOTION AS MATH.</span>
          <span id="s3-eq" class="mono">z = sin(<b>‖p‖</b>·k − ω·t) · A(t)</span>
        </div>
        <div id="s3-morph"></div>
      </div>
      <script>
        (function () {
          // Motion is authored in REEL time (seconds on the 15s master) so every beat
          // reads against the whole piece; the timeline is shifted to local time at the end.
          const T0 = 4.3;
          const W = 1920;
          const H = 1080;
          const FPS = 30;
          const tl = gsap.timeline({ paused: true });

          // Deterministic hash — never Math.random.
          const hash = (n) => {
            const x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
            return x - Math.floor(x);
          };
          const clamp01 = (v) => Math.min(1, Math.max(0, v));
          const p3io = gsap.parseEase("power3.inOut");
          const p3o = gsap.parseEase("power3.out");
          const p3i = gsap.parseEase("power3.in");

          /* ───────────── S3 · WAVE FIELD ───────────── */
          const plane = document.getElementById("s3-plane");
          const COLS = 36;
          const ROWS = 22;
          const SP = 64;
          const PW = COLS * SP;
          const PH = ROWS * SP;
          const dots = [];
          for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
              const el = document.createElement("i");
              el.className = "dot";
              const px = (c + 0.5) * SP - PW / 2;
              const py = (r + 0.5) * SP - PH / 2;
              el.style.left = PW / 2 + "px";
              el.style.top = PH / 2 + "px";
              plane.appendChild(el);
              dots.push({ el, px, py, d: Math.hypot(px, py), hot: false });
            }
          }
          const MAXD = Math.hypot(PW / 2, PH / 2);
          const S3 = 4.45;
          const field = { t: 0 };
          const renderField = () => {
            const t = field.t; // absolute seconds
            const lt = t - S3;
            const R = p3o(clamp01(lt / 0.55)) * (MAXD + 80);
            const A = 70 * clamp01((lt - 0.05) / 0.5) * (1 - clamp01((t - 6.2) / 0.35));
            const c = p3i(clamp01((t - 6.3) / 0.45));
            for (const p of dots) {
              const reveal = clamp01((R - p.d) / 90);
              const w = Math.sin(p.d * 0.011 - lt * 7.5);
              const z = A * w;
              const s = reveal * (1 + (z / 70) * 0.75) * (1 - c * 0.35);
              const x = p.px * (1 - c);
              const y = p.py * (1 - c);
              p.el.style.transform = `translate3d(${x.toFixed(1)}px, ${y.toFixed(1)}px, ${z.toFixed(1)}px) scale(${Math.max(0, s).toFixed(3)})`;
              const hot = A > 20 && w > 0.82;
              if (hot !== p.hot) {
                p.hot = hot;
                p.el.style.background = hot ? "#ff4d1f" : "#f3ece2";
              }
            }
          };
          tl.fromTo(
            field,
            { t: 4.3 },
            { t: 7.05, duration: 2.75, ease: "none", onUpdate: renderField },
            4.3,
          );
          // camera: tilted plane slowly yaws, then flattens as everything collapses to one point
          tl.fromTo(
            plane,
            { rotationX: 62, rotationZ: -10, y: 60 },
            { rotationX: 62, rotationZ: 8, y: 60, duration: 1.84, ease: "sine.inOut" },
            4.45,
          );
          tl.to(plane, { rotationX: 0, rotationZ: 0, y: 0, duration: 0.5, ease: "power3.in" }, 6.3);
          tl.fromTo(
            "#s3-head",
            { yPercent: 100, opacity: 0 },
            { yPercent: 0, opacity: 1, duration: 0.45, ease: "power4.out" },
            4.8,
          );
          tl.fromTo(
            "#s3-eq",
            { opacity: 0, x: -30 },
            { opacity: 1, x: 0, duration: 0.35, ease: "power3.out" },
            4.95,
          );
          tl.to("#s3-copy", { opacity: 0, y: 40, duration: 0.25, ease: "power2.in" }, 6.1);
          // morph: the collapsed point grows into the first panel of the range grid
          tl.fromTo(
            "#s3-morph",
            { opacity: 0, scale: 0.008, borderRadius: "456px", backgroundColor: "#ff4d1f" },
            { opacity: 1, duration: 0.01 },
            6.66,
          );
          tl.to(
            "#s3-morph",
            {
              scale: 1,
              borderRadius: "38px",
              backgroundColor: "#1b1613",
              duration: 0.3,
              ease: "expo.in",
            },
            6.67,
          );

          tl.shiftChildren(-T0);
          window.__timelines["s3"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
