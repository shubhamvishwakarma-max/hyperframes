<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #s2-root {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          overflow: hidden;
        }
        /* ───────── S2 principles ───────── */
        #s2-root {
          z-index: 16;
        }
        #s2-inner {
          background: var(--accent);
          color: var(--bg);
          clip-path: circle(120% at 50% 50%);
        }
        .pw {
          position: absolute;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          opacity: 0;
        }
        .pw-word {
          display: block;
          font-size: 230px;
          line-height: 0.9;
          letter-spacing: -0.03em;
          white-space: nowrap;
        }
        .pw-label {
          display: block;
          margin-top: 40px;
          font-size: 28px;
          letter-spacing: 0.3em;
        }
        #pw-overshoot .pw-word {
          font-size: 196px;
        }
        #pw-anticipate .pw-word {
          font-size: 190px;
        }
        .ghost-word {
          position: absolute;
          opacity: 0;
        }
        #pw-stagger .pw-word span {
          display: inline-block;
        }
        #s2-counter {
          position: absolute;
          left: 60px;
          top: 110px;
          font-size: 22px;
          letter-spacing: 0.2em;
        }
      </style>
      <div
        id="s2-root"
        class=""
        data-composition-id="s2"
        data-width="1920"
        data-height="1080"
        data-duration="2.5"
      >
        <div id="s2-inner" class="fill">
          <div id="s2-counter" class="mono">THE PRINCIPLES OF ANIMATION — PERFORMED</div>
          <div id="pw-squash" class="pw">
            <span class="pw-word">SQUASH</span>
            <span class="pw-label mono">PRINCIPLE 01</span>
          </div>
          <div id="pw-stretch" class="pw">
            <span class="pw-word">STRETCH</span>
            <span class="pw-label mono">PRINCIPLE 01 · CONT.</span>
          </div>
          <div id="pw-anticipate" class="pw">
            <span class="pw-word ghost-word" id="aw-g2">ANTICIPATE</span>
            <span class="pw-word ghost-word" id="aw-g1">ANTICIPATE</span>
            <span class="pw-word" id="aw-main">ANTICIPATE</span>
            <span class="pw-label mono">PRINCIPLE 02</span>
          </div>
          <div id="pw-overshoot" class="pw">
            <span class="pw-word">OVERSHOOT</span>
            <span class="pw-label mono">PRINCIPLE 05 · FOLLOW-THROUGH</span>
          </div>
          <div id="pw-stagger" class="pw">
            <span class="pw-word"
              ><span>S</span><span>T</span><span>A</span><span>G</span><span>G</span><span>E</span
              ><span>R</span></span
            >
            <span class="pw-label mono">PRINCIPLE 07 · OVERLAP</span>
          </div>
        </div>
      </div>
      <script>
        (function () {
          // Motion is authored in REEL time (seconds on the 15s master) so every beat
          // reads against the whole piece; the timeline is shifted to local time at the end.
          const T0 = 2;
          const W = 1920;
          const H = 1080;
          const FPS = 30;
          const tl = gsap.timeline({ paused: true });

          // Deterministic hash — never Math.random.
          const hash = (n) => {
            const x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
            return x - Math.floor(x);
          };
          const clamp01 = (v) => Math.min(1, Math.max(0, v));
          const p3io = gsap.parseEase("power3.inOut");
          const p3o = gsap.parseEase("power3.out");
          const p3i = gsap.parseEase("power3.in");

          /* ───────────── S2 · PRINCIPLES ───────────── */
          tl.fromTo("#s2-counter", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 2.05);
          const showWord = (sel, a, b) => {
            tl.set(sel, { opacity: 1 }, a);
            tl.set(sel, { opacity: 0 }, b);
          };
          // SQUASH — falls, squashes on contact, recovers
          showWord("#pw-squash", 2.0, 2.5);
          const sq = "#pw-squash .pw-word";
          tl.fromTo(
            sq,
            { y: -760, scaleX: 0.85, scaleY: 1.25 },
            { y: 0, duration: 0.18, ease: "power2.in", transformOrigin: "50% 100%" },
            2.0,
          );
          tl.to(sq, { scaleX: 1.35, scaleY: 0.5, duration: 0.06, ease: "power2.out" }, 2.18);
          tl.to(sq, { scaleX: 1, scaleY: 1, duration: 0.3, ease: "elastic.out(1, 0.35)" }, 2.24);
          tl.fromTo(
            "#pw-squash .pw-label",
            { opacity: 0, y: 20 },
            { opacity: 1, y: 0, duration: 0.2 },
            2.2,
          );
          // STRETCH — arrives stretched at speed, snaps back to shape
          showWord("#pw-stretch", 2.5, 3.0);
          tl.fromTo(
            "#pw-stretch .pw-word",
            { x: 1700, scaleX: 3.2, scaleY: 0.4 },
            { x: 0, scaleX: 1, scaleY: 1, duration: 0.42, ease: "expo.out" },
            2.5,
          );
          tl.fromTo(
            "#pw-stretch .pw-label",
            { opacity: 0, y: 20 },
            { opacity: 1, y: 0, duration: 0.2 },
            2.62,
          );
          // ANTICIPATE — winds back, then launches off frame with an echo trail
          showWord("#pw-anticipate", 3.0, 3.5);
          [
            ["#aw-main", 0, 1],
            ["#aw-g1", 0.025, 0.35],
            ["#aw-g2", 0.05, 0.15],
          ].forEach(([sel, lag, op]) => {
            tl.fromTo(
              sel,
              { x: 0, scaleX: 1, skewX: 0, opacity: sel === "#aw-main" ? 1 : 0 },
              { x: -110, scaleX: 0.86, skewX: 16, duration: 0.24, ease: "power2.out" },
              3.0 + lag * 0.3,
            );
            tl.set(sel, { opacity: op }, 3.24);
            tl.to(
              sel,
              { x: 2300, scaleX: 1.6, skewX: -28, duration: 0.2, ease: "power4.in" },
              3.24 + lag,
            );
          });
          tl.fromTo(
            "#pw-anticipate .pw-label",
            { opacity: 0 },
            { opacity: 1, duration: 0.15 },
            3.05,
          );
          tl.to("#pw-anticipate .pw-label", { opacity: 0, duration: 0.1 }, 3.36);
          // OVERSHOOT — springs past its mark and settles back
          showWord("#pw-overshoot", 3.5, 4.0);
          tl.fromTo(
            "#pw-overshoot .pw-word",
            { scale: 0, rotation: -8 },
            { scale: 1, rotation: 0, duration: 0.45, ease: "back.out(4)" },
            3.5,
          );
          tl.fromTo(
            "#pw-overshoot .pw-label",
            { opacity: 0, y: 20 },
            { opacity: 1, y: 0, duration: 0.2 },
            3.6,
          );
          // STAGGER — letters overlap their arrivals
          showWord("#pw-stagger", 4.0, 4.5);
          tl.fromTo(
            "#pw-stagger .pw-word span",
            { y: 320, rotation: 18 },
            { y: 0, rotation: 0, duration: 0.32, ease: "back.out(2.2)", stagger: 0.035 },
            4.0,
          );
          tl.fromTo(
            "#pw-stagger .pw-label",
            { opacity: 0, y: 20 },
            { opacity: 1, y: 0, duration: 0.2 },
            4.08,
          );
          // iris closes into the single point the wave field grows from
          tl.fromTo(
            "#s2-inner",
            { clipPath: "circle(120% at 50% 50%)" },
            {
              clipPath: "circle(0% at 50% 50%)",
              duration: 0.2,
              ease: "power3.in",
              immediateRender: false,
            },
            4.28,
          );

          tl.shiftChildren(-T0);
          window.__timelines["s2"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
