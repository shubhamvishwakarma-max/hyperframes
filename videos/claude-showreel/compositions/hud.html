<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #hud-root {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          overflow: hidden;
        }
        /* ───────── HUD ───────── */
        #hud-root {
          z-index: 50;
          color: var(--dim);
          font-size: 20px;
          letter-spacing: 0.08em;
          pointer-events: none;
        }
        .hud-item {
          position: absolute;
          white-space: nowrap;
        }
        #hud-tl {
          left: 60px;
          top: 48px;
        }
        #hud-tr {
          right: 60px;
          top: 48px;
          display: flex;
          align-items: center;
          gap: 14px;
        }
        #hud-rec {
          display: block;
          width: 14px;
          height: 14px;
          border-radius: 50%;
          background: var(--accent);
        }
        #hud-tc {
          font-variant-numeric: tabular-nums;
          color: currentColor;
        }
        #hud-bl {
          left: 60px;
          bottom: 64px;
        }
        #hud-br {
          right: 60px;
          bottom: 64px;
        }
        #hud-ruler {
          position: absolute;
          left: 60px;
          right: 60px;
          bottom: 40px;
          height: 12px;
        }
        #hud-ruler-line {
          position: absolute;
          left: 0;
          right: 0;
          top: 11px;
          height: 1px;
          background: currentColor;
          opacity: 0.5;
        }
        .ruler-tick {
          position: absolute;
          top: 4px;
          width: 1px;
          height: 8px;
          background: currentColor;
          opacity: 0.6;
        }
        #hud-ruler-head {
          position: absolute;
          left: -6px;
          top: 0;
          width: 12px;
          height: 12px;
          background: var(--accent);
          transform: rotate(45deg);
        }
        #hud-ruler-head-wrap {
          position: absolute;
          left: 0;
          top: 0;
          width: 1px;
          height: 12px;
        }

        /* ───────── grain (registry: grain-overlay) ───────── */
        @keyframes hf-grain-noise {
          0%,
          100% {
            transform: translate(0, 0);
          }
          10% {
            transform: translate(-5%, -5%);
          }
          20% {
            transform: translate(-10%, 5%);
          }
          30% {
            transform: translate(5%, -10%);
          }
          40% {
            transform: translate(-5%, 15%);
          }
          50% {
            transform: translate(-10%, 5%);
          }
          60% {
            transform: translate(15%, 0);
          }
          70% {
            transform: translate(0, 10%);
          }
          80% {
            transform: translate(-15%, 0);
          }
          90% {
            transform: translate(10%, 5%);
          }
        }
        #grain-overlay {
          position: absolute;
          inset: 0;
          pointer-events: none;
          z-index: 100;
          overflow: hidden;
        }
        #grain-overlay .grain-texture {
          position: absolute;
          top: -50%;
          left: -50%;
          width: 200%;
          height: 200%;
          background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
          opacity: 0.07;
          animation: hf-grain-noise 0.5s steps(1) 30;
        }
      </style>
      <div
        id="hud-root"
        class="mono"
        data-composition-id="hud"
        data-width="1920"
        data-height="1080"
        data-duration="15"
      >
        <div id="hud-tl" class="hud-item">CLAUDE — MOTION REEL 2026</div>
        <div id="hud-tr" class="hud-item">
          <i id="hud-rec"></i><span>REC</span><span id="hud-tc">00:00:00:00</span>
        </div>
        <div id="hud-bl" class="hud-item"><span id="hud-scene">01 / KEYFRAME</span></div>
        <div id="hud-br" class="hud-item">1920×1080 · 30 FPS</div>
        <div id="hud-ruler">
          <div id="hud-ruler-line"></div>
          <div id="hud-ruler-ticks"></div>
          <div id="hud-ruler-head-wrap"><i id="hud-ruler-head"></i></div>
        </div>

        <div id="grain-overlay"><div class="grain-texture"></div></div>
      </div>
      <script>
        (function () {
          // Motion is authored in REEL time (seconds on the 15s master) so every beat
          // reads against the whole piece; the timeline is shifted to local time at the end.
          const T0 = 0;
          const W = 1920;
          const H = 1080;
          const FPS = 30;
          const tl = gsap.timeline({ paused: true });

          // Deterministic hash — never Math.random.
          const hash = (n) => {
            const x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
            return x - Math.floor(x);
          };
          const clamp01 = (v) => Math.min(1, Math.max(0, v));
          const p3io = gsap.parseEase("power3.inOut");
          const p3o = gsap.parseEase("power3.out");
          const p3i = gsap.parseEase("power3.in");

          /* ───────────── HUD: timecode, scene label, ruler, rec blink ───────────── */
          const SCENES = [
            [0, "01 / KEYFRAME"],
            [2.0, "02 / PRINCIPLES"],
            [4.45, "03 / GENERATIVE"],
            [7.0, "04 / RANGE"],
            [9.45, "05 / DEPTH"],
            [11.5, "06 / KINETIC"],
            [13.2, "07 / FIN"],
          ];
          const ticks = document.getElementById("hud-ruler-ticks");
          const RULER_W = W - 120;
          for (let s = 0; s <= 15; s++) {
            const t = document.createElement("i");
            t.className = "ruler-tick";
            t.style.left = (s / 15) * RULER_W + "px";
            t.style.height = s % 5 === 0 ? "12px" : "8px";
            t.style.top = s % 5 === 0 ? "0px" : "4px";
            ticks.appendChild(t);
          }
          const tcEl = document.getElementById("hud-tc");
          const sceneEl = document.getElementById("hud-scene");
          const recEl = document.getElementById("hud-rec");
          const pad = (n) => String(n).padStart(2, "0");
          const hudDriver = { t: 0 };
          tl.fromTo(
            hudDriver,
            { t: 0 },
            {
              t: 15,
              duration: 15,
              ease: "none",
              onUpdate: () => {
                const t = hudDriver.t;
                const f = Math.min(Math.floor(t * FPS + 1e-6), 15 * FPS - 1);
                const ss = Math.floor(f / FPS);
                tcEl.textContent = `00:00:${pad(ss)}:${pad(f % FPS)}`;
                let label = SCENES[0][1];
                for (const [st, l] of SCENES) if (t >= st) label = l;
                if (sceneEl.textContent !== label) sceneEl.textContent = label;
                recEl.style.opacity = Math.floor(t * 2) % 2 === 0 ? "1" : "0.25";
              },
            },
            0,
          );
          tl.fromTo(
            "#hud-ruler-head-wrap",
            { x: 0 },
            { x: RULER_W, duration: 15, ease: "none" },
            0,
          );
          tl.fromTo(
            "#hud-tl, #hud-tr, #hud-bl, #hud-br",
            { opacity: 0, y: -12 },
            { opacity: 1, y: 0, duration: 0.4, ease: "power3.out", stagger: 0.05 },
            0.05,
          );
          tl.fromTo("#hud-ruler", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0.1);
          // HUD flips to ink while the accent principles scene is up
          tl.set("#hud-root", { color: "#100d0b" }, 2.0);
          tl.set("#hud-root", { color: "#bdb3a6" }, 4.42);

          tl.shiftChildren(-T0);
          window.__timelines["hud"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
