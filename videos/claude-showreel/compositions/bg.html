<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #bg-root {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          overflow: hidden;
        }
        /* ───────── persistent background ───────── */
        #bg-grid {
          background-image:
            linear-gradient(var(--line) 1px, transparent 1px),
            linear-gradient(90deg, var(--line) 1px, transparent 1px);
          background-size: 120px 120px;
          background-position: 0 0;
          opacity: 0.5;
        }
        #bg-glow {
          position: absolute;
          left: 460px;
          top: 40px;
          width: 1000px;
          height: 1000px;
          border-radius: 50%;
          background: radial-gradient(circle, rgba(255, 77, 31, 0.22) 0%, rgba(255, 77, 31, 0) 65%);
        }
      </style>
      <div
        id="bg-root"
        class=""
        data-composition-id="bg"
        data-width="1920"
        data-height="1080"
        data-duration="15"
      >
        <div id="bg-grid" class="fill"></div>
        <div id="bg-glow" data-layout-allow-overflow></div>
      </div>
      <script>
        (function () {
          // Motion is authored in REEL time (seconds on the 15s master) so every beat
          // reads against the whole piece; the timeline is shifted to local time at the end.
          const T0 = 0;
          const W = 1920;
          const H = 1080;
          const FPS = 30;
          const tl = gsap.timeline({ paused: true });

          // Deterministic hash — never Math.random.
          const hash = (n) => {
            const x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
            return x - Math.floor(x);
          };
          const clamp01 = (v) => Math.min(1, Math.max(0, v));
          const p3io = gsap.parseEase("power3.inOut");
          const p3o = gsap.parseEase("power3.out");
          const p3i = gsap.parseEase("power3.in");

          // ambient background: slow grid drift + breathing glow
          tl.fromTo(
            "#bg-grid",
            { backgroundPosition: "0px 0px" },
            { backgroundPosition: "120px 240px", duration: 15, ease: "none" },
            0,
          );
          tl.fromTo(
            "#bg-glow",
            { scale: 0.85, opacity: 0.6 },
            { scale: 1.15, opacity: 1, duration: 3.75, ease: "sine.inOut", yoyo: true, repeat: 3 },
            0,
          );

          tl.shiftChildren(-T0);
          window.__timelines["bg"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
