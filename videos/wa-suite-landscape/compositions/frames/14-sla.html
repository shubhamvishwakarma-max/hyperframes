        (function () {
          const tl = gsap.timeline({ paused: true });

            tl.fromTo(sel, { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.28, ease: "power2.out" }, t);
            const light = color === "#FFFFFF";
            tl.to(sel, { color: color, duration: light ? 0.35 : 0.18, ease: "power1.out" }, t + (light ? 0.12 : 0.04));
          };

          // ---------- Beat A (0 – 2.4): "It's not just" / Keyword-Based / Alerts ----------
          tl.fromTo("#f14-agroup", { scale: 1 }, { scale: 1.04, duration: 2.4, ease: "none" }, 0);
          word("#f14-a-its", 0.0, "#FFFFFF");
          word("#f14-a-not", 0.2, "#FFFFFF");
          word("#f14-a-just", 0.44, "#FFFFFF");
          // tracking settle: letters start spread wide and slide together (transform-only)
          const letters = [];
          ["#f14-kw1", "#f14-kw2"].forEach((id) => {
            const el = document.querySelector(id);
            const txt = el.textContent;
            el.textContent = "";
            for (const ch of txt) {
              const s = document.createElement("span");
              s.className = "f14-l";
              s.textContent = ch;
              el.appendChild(s);
              letters.push(s);
            }
          });
          const mid = (letters.length - 1) / 2;
          tl.fromTo("#f14-kw", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power1.out" }, 0.62);
          tl.fromTo(letters, { x: (i) => (i - mid) * 26 }, { x: 0, duration: 0.95, ease: "power3.out" }, 0.62);
          tl.fromTo("#f14-alerts", { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.8)" }, 1.15);
          tl.fromTo("#f14-alerts-i", { opacity: 0, scale: 0.4, rotation: -20 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.35, ease: "back.out(2)" }, 1.3);
          tl.fromTo("#f14-alerts-t", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, 1.46);
          tl.to("#f14-alerts", { scale: 1.04, duration: 0.6, ease: "sine.inOut" }, 1.75);
          tl.set("#f14-a", { opacity: 0 }, 2.4);
          tl.set("#f14-b", { opacity: 1 }, 2.4);

          // ---------- Beat B (2.4 – 5.94): AI SLA filtering card ----------
          tl.fromTo("#f14-card", { opacity: 0.25, y: 40 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 2.4);
          tl.fromTo("#f14-cursor", { x: -260, y: 560, opacity: 0 }, { x: -260, y: 560, opacity: 1, duration: 0.2 }, 2.6);
          tl.to("#f14-cursor", { x: 0, y: 0, duration: 1.0, ease: "power2.inOut" }, 2.9);
          tl.to("#f14-cursor", { scale: 0.85, duration: 0.08, ease: "power1.in", transformOrigin: "5% 5%" }, 4.0);
          tl.to("#f14-cursor", { scale: 1, duration: 0.18, ease: "back.out(2)" }, 4.08);
          tl.fromTo("#f14-ripple", { opacity: 0.9, scale: 0.3 }, { opacity: 0, scale: 1.6, duration: 0.5, ease: "power2.out" }, 4.05);
          tl.fromTo("#f14-knob", { x: 0 }, { x: 56, duration: 0.25, ease: "power2.out" }, 4.08);
          tl.to("#f14-knob", { backgroundColor: "#C8161D", duration: 0.2, ease: "none" }, 4.08);
          tl.to("#f14-toggle", { backgroundColor: "#F7CFD4", duration: 0.2, ease: "none" }, 4.08);
          // list collapses to the two rows that truly need a reply
          tl.to("#f14-r2", { x: -200, opacity: 0, duration: 0.35, ease: "power2.in" }, 4.3);
          tl.to("#f14-r3", { x: 200, opacity: 0, duration: 0.35, ease: "power2.in" }, 4.36);
          tl.to("#f14-r4", { y: -320, duration: 0.5, ease: "power3.inOut" }, 4.55);
          // card tightens around the two remaining rows and re-centres in the hero band
          tl.to("#f14-card", { height: 476, y: 82, duration: 0.5, ease: "power3.inOut" }, 4.6);
          tl.to("#f14-cursor", { x: 40, y: -40, duration: 0.8, ease: "sine.inOut" }, 4.9);
          // captions
          word("#f14-b-ai", 2.51, "#1C1C1E");
          word("#f14-b-filt", 2.99, "#1C1C1E");
          word("#f14-b-sla", 3.53, "#1C1C1E");
          tl.to("#f14-capb1", { opacity: 0, y: -24, duration: 0.15, ease: "power1.in" }, 4.18);
          word("#f14-b-app", 4.34, "#1C1C1E");
          word("#f14-b-sla2", 5.0, "#1C1C1E");
          tl.set("#f14-b", { opacity: 0 }, 5.94);
          tl.set("#f14-capb2", { opacity: 0 }, 5.94);

          // ---------- Beat C (5.94 – 8.3): woman at laptop ----------
          tl.fromTo("#f14-vidwrap", { scale: 1 }, { scale: 1.05, duration: 2.36, ease: "none" }, 5.94);
          word("#f14-c-only", 5.96, "#FFFFFF");
          word("#f14-c-where", 6.0, "#FFFFFF");
          word("#f14-c-a", 6.11, "#FFFFFF");
          word("#f14-c-resp", 6.2, "#FFFFFF");
          tl.to("#f14-capc1", { opacity: 0, y: -24, duration: 0.15, ease: "power1.in" }, 6.6);
          word("#f14-c-is", 6.77, "#FFFFFF");
          word("#f14-c-truly", 6.98, "#FFFFFF");
          word("#f14-c-req", 7.46, "#FFFFFF");

          window.__timelines["f14"] = tl;
