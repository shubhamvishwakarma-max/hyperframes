<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: Inter, sans-serif;
          background: #f7f3ec;
          color: #1c1c1e;
        }
        #f03-vidwrap {
          position: absolute;
          inset: 0;
        }
        #f03-vid {
          position: absolute;
          inset: 0;
          width: 1920px;
          height: 1080px;
          object-fit: cover;
        }
        /* cream flood that grows out of the disc (centre 960,1034) and fills the frame */
        #f03-fill {
          position: absolute;
          left: 360px;
          top: 434px;
          width: 1200px;
          height: 1200px;
          border-radius: 50%;
          background: #f7f3ec;
          box-shadow: 0 0 0 26px rgba(255, 255, 255, 0.45);
        }
        #f03-glow {
          position: absolute;
          inset: 0;
          opacity: 0;
          background:
            radial-gradient(circle at 100% 100%, rgba(247, 207, 212, 0.75), transparent 55%),
            radial-gradient(circle at 0% 0%, rgba(247, 207, 212, 0.45), transparent 45%);
        }
        .f03-q {
          position: absolute;
          color: #e0676c;
          opacity: 0;
          filter: blur(3px);
        }
        .f03-q svg {
          display: block;
          width: 100%;
          height: 100%;
        }
        #f03-halo {
          position: absolute;
          left: 400px;
          top: 474px;
          width: 1120px;
          height: 1120px;
          border-radius: 50%;
          background: rgba(255, 255, 255, 0.6);
        }
        #f03-core {
          position: absolute;
          left: 585px;
          top: 659px;
          width: 750px;
          height: 750px;
          border-radius: 50%;
          background: #fad6d9;
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 20px;
        }
        .f03-t {
          display: block;
          font-size: 200px;
          font-weight: 600;
          letter-spacing: -0.045em;
          color: #c8161d;
        }
        #f03-qm {
          opacity: 0;
        }
      </style>

      <div id="root" data-composition-id="f03" data-width="1920" data-height="1080">
        <div id="f03-vidwrap">
          <video data-hf-media-start-basis="local" id="f03-vid" src="assets/footage/laptop.mp4" data-start="0" data-duration="0.66" data-media-start="2.79" data-track-index="0" muted playsinline></video>
        </div>
        <div id="f03-fill"></div>
        <div id="f03-glow"></div>

        <div class="f03-q" id="f03-q1" style="left: 150px; top: 170px; width: 170px; height: 230px">
          <svg viewBox="5 3 14 19" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M8.2 8.4a3.9 3.9 0 1 1 5.4 3.6c-1.1.5-1.6 1.3-1.6 2.4v1" /><circle cx="12" cy="19.4" r="0.6" fill="currentColor" /></svg>
        </div>
        <div class="f03-q" id="f03-q2" style="left: 1560px; top: 190px; width: 130px; height: 176px">
          <svg viewBox="5 3 14 19" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M8.2 8.4a3.9 3.9 0 1 1 5.4 3.6c-1.1.5-1.6 1.3-1.6 2.4v1" /><circle cx="12" cy="19.4" r="0.6" fill="currentColor" /></svg>
        </div>
        <div class="f03-q" id="f03-q3" style="left: 300px; top: 690px; width: 190px; height: 257px">
          <svg viewBox="5 3 14 19" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M8.2 8.4a3.9 3.9 0 1 1 5.4 3.6c-1.1.5-1.6 1.3-1.6 2.4v1" /><circle cx="12" cy="19.4" r="0.6" fill="currentColor" /></svg>
        </div>
        <div class="f03-q" id="f03-q4" style="left: 1500px; top: 640px; width: 220px; height: 298px">
          <svg viewBox="5 3 14 19" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M8.2 8.4a3.9 3.9 0 1 1 5.4 3.6c-1.1.5-1.6 1.3-1.6 2.4v1" /><circle cx="12" cy="19.4" r="0.6" fill="currentColor" /></svg>
        </div>
        <div class="f03-q" id="f03-q5" style="left: 1750px; top: 470px; width: 110px; height: 149px">
          <svg viewBox="5 3 14 19" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M8.2 8.4a3.9 3.9 0 1 1 5.4 3.6c-1.1.5-1.6 1.3-1.6 2.4v1" /><circle cx="12" cy="19.4" r="0.6" fill="currentColor" /></svg>
        </div>

        <div id="f03-halo"></div>
        <div id="f03-core">
          <span class="f03-t" id="f03-why">Why</span>
          <span class="f03-t" id="f03-qm">?</span>
        </div>
      </div>

      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          // Laptop shot keeps pushing in underneath (continues f02)
          tl.fromTo("#f03-vidwrap", { scale: 1.04 }, { scale: 1.06, duration: 0.66, ease: "none" }, 0);
          // Cream flood grows out of the disc and fills the frame (always ahead of the burned halo)
          tl.fromTo("#f03-fill", { scale: 1 }, { scale: 2.5, duration: 0.36, ease: "power1.in" }, 0);
          tl.fromTo("#f03-glow", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 0.34);
          // Disc keeps rising with the burned one (centre 960,1034; next-frame radius + 14) under the flood
          const discTrack = [
            [0.0, 375], [0.033, 404], [0.075, 428], [0.117, 449], [0.158, 471], [0.2, 492],
          ];
          discTrack.forEach(([t, r]) => {
            const h = Math.max(560, r + 100);
            tl.set("#f03-core", { left: 960 - r, top: 1034 - r, width: 2 * r, height: 2 * r }, t);
            tl.set("#f03-halo", { left: 960 - h, top: 1034 - h, width: 2 * h, height: 2 * h }, t);
          });
          // Then the disc lifts into frame centre and "Why?" becomes the giant hero word
          tl.to("#f03-halo", { left: 410, top: 50, width: 1100, height: 1100, backgroundColor: "rgba(247,207,212,0.45)", duration: 0.5, ease: "power3.inOut" }, 0.24);
          tl.to("#f03-core", { left: 490, top: 130, width: 940, height: 940, duration: 0.5, ease: "power3.inOut" }, 0.24);
          tl.to(".f03-t", { fontSize: 300, duration: 0.5, ease: "power3.inOut" }, 0.24);
          tl.to("#f03-halo", { left: 395, top: 35, width: 1130, height: 1130, duration: 0.76, ease: "sine.inOut" }, 0.74);
          // "Why ?" settles to full red on the VO hit (why @ local 0.07)
          tl.fromTo("#f03-why", { opacity: 0.55, y: 10 }, { opacity: 1, y: 0, duration: 0.28, ease: "power2.out" }, 0.0);
          tl.fromTo("#f03-qm", { opacity: 0, scale: 0.4, rotation: -25 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.4, ease: "back.out(2.2)" }, 0.3);
          tl.to("#f03-qm", { rotation: 10, duration: 0.45, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0.62);
          // Soft red question marks drift at the edges
          const drift = [
            ["#f03-q1", 0.36, -18, -40, -12],
            ["#f03-q2", 0.42, 14, -50, 16],
            ["#f03-q3", 0.38, 10, -60, 10],
            ["#f03-q4", 0.46, -12, -45, -14],
            ["#f03-q5", 0.5, 8, -35, 20],
          ];
          drift.forEach(([sel, t, dx, dy, rot]) => {
            tl.fromTo(sel, { opacity: 0, x: 0, y: 30, rotation: 0 }, { opacity: 0.6, x: dx, y: dy, rotation: rot, duration: 1.5 - t, ease: "sine.out" }, t);
          });

          window.__timelines["f03"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
