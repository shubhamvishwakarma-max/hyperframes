      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const word = (sel, t) => {
            tl.fromTo(sel, { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.28, ease: "power2.out" }, t);
            tl.to(sel, { color: "#1C1C1E", duration: 0.35, ease: "power1.out" }, t + 0.12);
          };

          // (a) cream "that means"
          tl.fromTo("#f16-means", { scale: 1 }, { scale: 1.05, duration: 1, ease: "none" }, 0);
          word("#f16-that", 0.06);
          word("#f16-meansw", 0.33);
          tl.to("#f16-cream", { opacity: 0, duration: 0.05, ease: "none" }, 0.9);

          // (b) green: glow breathes the whole beat
          tl.fromTo("#f16-glow", { scale: 0.9, opacity: 0.7 }, { scale: 1.1, opacity: 1, duration: 7.2, ease: "sine.inOut" }, 0.9);

          // card lands on each benefit word (local = global - 73.2)
          const lands = [1.05, 2.67, 4.68, 6.6];
          const END = 8.1;
          tl.fromTo("#f16-dots", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 0.95);
          lands.forEach((L, i) => {
            const n = i + 1;
            tl.to("#f16-d" + n, { backgroundColor: "#22F08A", duration: 0.25, ease: "power1.out" }, L - 0.1);
            const card = "#f16-card" + n;
            const enter = 0.3;
            tl.fromTo(card, { x: 1500, opacity: 0, filter: "blur(36px)", scale: 0.96 }, { x: 0, opacity: 1, filter: "blur(0px)", scale: 1, duration: enter, ease: "power3.out" }, L - enter + 0.04);
            tl.fromTo("#f16-tile" + n, { scale: 0.6 }, { scale: 1, duration: 0.45, ease: "back.out(1.8)" }, L - 0.08);
            const chars = document.querySelectorAll(card + " .f16-ch");
            const typeDur = 0.55;
            tl.fromTo(chars, { opacity: 0 }, { opacity: 1, duration: 0.14, ease: "power1.out", stagger: typeDur / chars.length }, L + 0.02);
            const next = lands[i + 1];
            if (next !== undefined) {
              const exitAt = next - 0.5;
              tl.fromTo(card, { x: 0 }, { x: -48, duration: exitAt - L - 0.06, ease: "none", immediateRender: false }, L + 0.06);
              tl.to(card, { x: -1700, filter: "blur(36px)", opacity: 0, duration: 0.26, ease: "power3.in" }, exitAt);
            } else {
              tl.fromTo(card, { scale: 1 }, { scale: 1.035, duration: END - L - 0.06, ease: "sine.out", immediateRender: false }, L + 0.06);
            }
          });

          window.__timelines["f16"] = tl;
