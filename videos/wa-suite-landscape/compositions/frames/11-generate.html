      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const word = (sel, t) => {
            tl.fromTo(sel, { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.28, ease: "power2.out" }, t);
            tl.to(sel, { color: "#1C1C1E", duration: 0.35, ease: "power1.out" }, t + 0.12);
          };
          const HX = 41;
          const HY = 10;
          const move = (x, y, t, d) => {
            tl.to("#f11-cursor", { x: x - HX, y: y - HY, duration: d, ease: "power2.inOut" }, t);
          };
          const click = (n, t) => {
            tl.fromTo("#f11-hand", { scale: 1 }, { scale: 0.85, duration: 0.08, ease: "power1.out", transformOrigin: "33% 10%" }, t);
            tl.to("#f11-hand", { scale: 1, duration: 0.18, ease: "back.out(2)" }, t + 0.08);
            tl.fromTo("#f11-ring" + n, { opacity: 1, scale: 0.3 }, { opacity: 0, scale: 1.6, duration: 0.45, ease: "power2.out", immediateRender: false }, t);
            ["a", "b", "c"].forEach((k, i) => {
              const s = "#f11-s" + n + k;
              tl.fromTo(s, { opacity: 0, scale: 0.2, rotation: -30 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.25, ease: "back.out(2)" }, t + 0.03 + i * 0.04);
              tl.to(s, { opacity: 0, scale: 0.6, duration: 0.3, ease: "power1.in" }, t + 0.45 + i * 0.04);
            });
          };

          // Window arrives, then a slow push-in across the whole beat
          tl.fromTo("#f11-win", { opacity: 0.3, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0);
          tl.fromTo("#f11-composer, #f11-send", { opacity: 0.3, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0);
          tl.fromTo("#f11-bubble0", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 0.05);
          tl.fromTo("#f11-bubble", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 0.25);
          tl.fromTo("#f11-stage", { scale: 1 }, { scale: 1.025, duration: 5.1, ease: "none", transformOrigin: "68% 52%" }, 0);

          // Cursor: in from the right → magic wand → click
          tl.fromTo("#f11-cursor", { x: 1850 - HX, y: 700 - HY, opacity: 0 }, { x: 1780 - HX, y: 690 - HY, opacity: 1, duration: 0.35, ease: "power2.out" }, 0.45);
          move(1720, 760, 0.8, 0.35);
          move(1598, 866, 1.15, 0.4);
          click(1, 1.6);
          tl.fromTo("#f11-wand", { color: "#6B665F" }, { color: "#1FA855", duration: 0.2 }, 1.6);

          // Generate Reply panel slides up and types the answer
          tl.fromTo("#f11-panel", { opacity: 0, y: 60, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "power3.out" }, 1.72);
          const typeEl = document.querySelector("#f11-type");
          const txt = typeEl.textContent;
          typeEl.textContent = "";
          const chars = [];
          for (let i = 0; i < txt.length; i++) {
            const s = document.createElement("span");
            s.textContent = txt[i];
            typeEl.appendChild(s);
            chars.push(s);
          }
          tl.fromTo(chars, { opacity: 0 }, { opacity: 1, duration: 0.01, stagger: 1.25 / chars.length, ease: "none" }, 2.05);

          // Cursor → Use answer → click; text lands in the composer
          move(1631, 506, 3.4, 0.5);
          click(2, 3.98);
          tl.fromTo("#f11-use", { backgroundColor: "#D3F5E1" }, { backgroundColor: "#A9E8C4", duration: 0.12, yoyo: true, repeat: 1 }, 3.98);
          tl.to("#f11-ph", { opacity: 0, duration: 0.12, ease: "power1.in" }, 4.06);
          tl.fromTo("#f11-hl", { opacity: 0, scaleX: 0, transformOrigin: "0% 50%" }, { opacity: 1, scaleX: 1, duration: 0.35, ease: "power2.out" }, 4.08);
          tl.fromTo("#f11-ctext", { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.3, ease: "power2.out" }, 4.3);
          tl.to("#f11-hl", { opacity: 0, duration: 0.4, ease: "power1.in" }, 4.55);
          move(1700, 690, 4.3, 0.7);

          // Captions — left headline
          word("#f11-w-ai", 0.05);
          word("#f11-w-that", 0.5);
          word("#f11-w-generate", 0.95);
          word("#f11-w-replies", 1.46);
          tl.to("#f11-c1", { opacity: 0, y: -20, duration: 0.15, ease: "power1.in" }, 1.78);

          word("#f11-w-to", 3.92);
          word("#f11-w-send", 4.01);
          word("#f11-w-replies2", 4.28);
