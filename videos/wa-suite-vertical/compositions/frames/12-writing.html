      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const word = (sel, t) => {
            tl.fromTo(sel, { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.28, ease: "power2.out" }, t);
            tl.to(sel, { color: "#FFFFFF", duration: 0.35, ease: "power1.out" }, t + 0.12);
          };
          const HX = 41;
          const HY = 10;
          const move = (x, y, t, d) => {
            tl.to("#f12-cursor", { x: x - HX, y: y - HY, duration: d, ease: "power2.inOut" }, t);
          };
          const click = (n, t) => {
            tl.fromTo("#f12-hand", { scale: 1 }, { scale: 0.85, duration: 0.08, ease: "power1.out", transformOrigin: "33% 10%" }, t);
            tl.to("#f12-hand", { scale: 1, duration: 0.18, ease: "back.out(2)" }, t + 0.08);
            tl.fromTo("#f12-ring" + n, { opacity: 1, scale: 0.3 }, { opacity: 0, scale: 1.6, duration: 0.45, ease: "power2.out", immediateRender: false }, t);
            ["a", "b", "c"].forEach((k, i) => {
              const s = "#f12-s" + n + k;
              tl.fromTo(s, { opacity: 0, scale: 0.2, rotation: -30 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.25, ease: "back.out(2)" }, t + 0.03 + i * 0.04);
              tl.to(s, { opacity: 0, scale: 0.6, duration: 0.3, ease: "power1.in" }, t + 0.45 + i * 0.04);
            });
          };

          // Window arrives, then a slow push-in across the whole beat
          tl.fromTo("#f12-win", { opacity: 0.3, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0);
          tl.fromTo("#f12-composer, #f12-send", { opacity: 0.3, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0);
          tl.fromTo("#f12-bubble", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 0.1);
          tl.fromTo("#f12-stage", { scale: 1 }, { scale: 1.025, duration: 5.0, ease: "none", transformOrigin: "50% 45%" }, 0);

          // Draft typed into the composer
          const splitChars = (sel) => {
            const el = document.querySelector(sel);
            const txt = el.textContent;
            el.textContent = "";
            const out = [];
            for (let i = 0; i < txt.length; i++) {
              const sp = document.createElement("span");
              sp.textContent = txt[i];
              el.appendChild(sp);
              out.push(sp);
            }
            return out;
          };
          const draft = splitChars("#f12-draft");
          tl.fromTo(draft.slice(0, 12), { opacity: 0 }, { opacity: 1, duration: 0.01, stagger: 0.035, ease: "none" }, 0.3);
          tl.fromTo(draft.slice(12), { opacity: 0 }, { opacity: 1, duration: 0.01, stagger: 0.03, ease: "none" }, 0.78);

          // Cursor in near send, sweeps the draft highlight, then hits the magic wand
          tl.fromTo("#f12-cursor", { x: 1010 - HX, y: 1220 - HY, opacity: 0 }, { x: 960 - HX, y: 1100 - HY, opacity: 1, duration: 0.35, ease: "power2.out" }, 0.6);
          move(560, 1068, 1.0, 0.35);
          tl.fromTo("#f12-hl0", { opacity: 0, scaleX: 0, transformOrigin: "0% 50%" }, { opacity: 1, scaleX: 1, duration: 0.35, ease: "power2.out" }, 1.08);
          move(734, 1065, 1.3, 0.3);
          click(1, 1.62);
          tl.fromTo("#f12-wand", { color: "#6B665F" }, { color: "#1FA855", duration: 0.2 }, 1.62);

          // Writing improved panel
          tl.fromTo("#f12-panel", { opacity: 0, y: 60, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "power3.out" }, 1.74);
          tl.fromTo(".f12-rot", { rotation: 0 }, { rotation: 360, duration: 0.8, ease: "power2.inOut" }, 1.9);
          const chars = splitChars("#f12-type");
          tl.fromTo(chars, { opacity: 0 }, { opacity: 1, duration: 0.01, stagger: 1.2 / chars.length, ease: "none" }, 2.05);

          // Use answer → composer text replaced
          move(851, 754, 3.35, 0.5);
          click(2, 3.92);
          tl.fromTo("#f12-use", { backgroundColor: "#D3F5E1" }, { backgroundColor: "#A9E8C4", duration: 0.12, yoyo: true, repeat: 1 }, 3.92);
          tl.to("#f12-draft", { opacity: 0, duration: 0.15, ease: "power1.in" }, 4.0);
          tl.to("#f12-hl0", { opacity: 0, duration: 0.2, ease: "power1.in" }, 4.0);
          tl.fromTo("#f12-hl", { opacity: 0, scaleX: 0, transformOrigin: "0% 50%" }, { opacity: 1, scaleX: 1, duration: 0.3, ease: "power2.out" }, 4.02);
          tl.fromTo("#f12-ctext", { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.3, ease: "power2.out" }, 4.15);
          tl.to("#f12-hl", { opacity: 0, duration: 0.4, ease: "power1.in" }, 4.45);
          move(900, 860, 4.25, 0.6);

          // Captions
          word("#f12-w-ai", 0.08);
          word("#f12-w-writing", 0.53);
          word("#f12-w-assist", 0.92);
          tl.to("#f12-c1", { opacity: 0, y: -20, duration: 0.15, ease: "power1.in" }, 1.52);
          word("#f12-w-which", 1.7);
          word("#f12-w-improves", 1.88);
          word("#f12-w-tone", 2.39);
          word("#f12-w-and", 2.75);
          tl.to("#f12-c2", { opacity: 0, y: -20, duration: 0.15, ease: "power1.in" }, 2.85);
          word("#f12-w-grammar", 2.94);
          word("#f12-w-instantly", 3.44);

          window.__timelines["f12"] = tl;
        })();
