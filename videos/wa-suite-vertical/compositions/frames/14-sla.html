          const letters = [];
          ["#f14-kw1", "#f14-kw2"].forEach((id) => {
            const el = document.querySelector(id);
            const txt = el.textContent;
            el.textContent = "";
            for (const ch of txt) {
              const s = document.createElement("span");
              s.className = "f14-l";
              s.textContent = ch;
              el.appendChild(s);
              letters.push(s);
            }
          });
          const mid = (letters.length - 1) / 2;
          tl.fromTo("#f14-kw", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power1.out" }, 0.62);
          tl.fromTo(letters, { x: (i) => (i - mid) * 20 }, { x: 0, duration: 0.95, ease: "power3.out" }, 0.62);
          tl.fromTo("#f14-alerts", { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.8)" }, 1.15);

          tl.to("#f14-alerts", { scale: 1.04, duration: 0.6, ease: "sine.inOut" }, 1.75);
          tl.fromTo("#f14-a", { opacity: 1 }, { opacity: 0, duration: 0.01 }, 2.4);

          // ---------- Beat B (2.4 – 5.94): AI SLA filtering card ----------

          tl.to("#f14-cursor", { x: 0, y: 0, duration: 1.0, ease: "power2.inOut" }, 2.9);
          tl.to("#f14-cursor", { scale: 0.85, duration: 0.08, ease: "power1.in", transformOrigin: "5% 5%" }, 4.0);
          tl.to("#f14-cursor", { scale: 1, duration: 0.18, ease: "back.out(2)" }, 4.08);
          tl.fromTo("#f14-ripple", { opacity: 0.9, scale: 0.3 }, { opacity: 0, scale: 1.6, duration: 0.5, ease: "power2.out" }, 4.05);
          tl.fromTo("#f14-knob", { x: 0 }, { x: 56, duration: 0.25, ease: "power2.out" }, 4.08);
          tl.to("#f14-knob", { backgroundColor: "#C8161D", duration: 0.2, ease: "none" }, 4.08);

          // list collapses to the two rows that truly need a reply
          tl.to("#f14-r2", { x: -140, opacity: 0, duration: 0.35, ease: "power2.in" }, 4.3);
          tl.to("#f14-r3", { x: 140, opacity: 0, duration: 0.35, ease: "power2.in" }, 4.36);
          tl.to("#f14-r4", { y: -340, duration: 0.5, ease: "power3.inOut" }, 4.55);
          tl.to("#f14-cursor", { x: 30, y: 40, duration: 0.8, ease: "sine.inOut" }, 4.9);

          word("#f14-b-sla", 3.53, "#1C1C1E");
          tl.to("#f14-capb1", { opacity: 0, y: -24, duration: 0.15, ease: "power1.in" }, 4.18);
          word("#f14-b-app", 4.34, "#1C1C1E");
