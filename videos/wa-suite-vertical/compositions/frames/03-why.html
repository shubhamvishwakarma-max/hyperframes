<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: Inter, sans-serif;
          background: #f7f3ec;
          color: #1c1c1e;
        }
        #f03-vidwrap {
          position: absolute;
          inset: 0;
        }
        #f03-vid {
          position: absolute;
          inset: 0;
          width: 1080px;
          height: 1920px;
          object-fit: cover;
        }
        /* cream flood that grows out of the disc */
        #f03-fill {
          position: absolute;
          left: 40px;
          top: 545px;
          width: 1000px;
          height: 1000px;
          border-radius: 50%;
          background: #f7f3ec;
          box-shadow: 0 0 0 26px rgba(255, 255, 255, 0.45);
        }
        #f03-glow {
          position: absolute;
          inset: 0;
          opacity: 0;
          background:
            radial-gradient(circle at 100% 100%, rgba(247, 207, 212, 0.75), transparent 55%),
            radial-gradient(circle at 0% 0%, rgba(247, 207, 212, 0.45), transparent 45%);
        }
        .f03-q {
          position: absolute;
          color: #e0676c;
          opacity: 0;
          filter: blur(3px);
        }
        .f03-q svg {
          display: block;
          width: 100%;
          height: 100%;
        }
        #f03-disc {
          position: absolute;
          left: 40px;
          top: 545px;
          width: 1000px;
          height: 1000px;
          border-radius: 50%;
          background: rgba(255, 255, 255, 0.6);
        }
        #f03-core {
          position: absolute;
          left: 100px;
          top: 100px;
          width: 800px;
          height: 800px;
          border-radius: 50%;
          background: #fad6d9;
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 26px;
        }
        .f03-t {
          display: block;
          font-size: 200px;
          font-weight: 500;
          letter-spacing: -0.04em;
          color: #c8161d;
        }
        #f03-qm {
          opacity: 0;
        }
      </style>

      <div id="root" data-composition-id="f03" data-width="1080" data-height="1920">
        <div id="f03-vidwrap">
          <video id="f03-vid" src="assets/footage/laptop.mp4" data-start="0" data-duration="0.66" data-media-start="2.79" data-track-index="0" muted playsinline></video>
        </div>
        <div id="f03-fill"></div>
        <div id="f03-glow"></div>

        <div class="f03-q" id="f03-q1" style="left: 20px; top: 330px; width: 170px; height: 230px">
          <svg viewBox="5 3 14 19" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M8.2 8.4a3.9 3.9 0 1 1 5.4 3.6c-1.1.5-1.6 1.3-1.6 2.4v1" /><circle cx="12" cy="19.4" r="0.6" fill="currentColor" /></svg>
        </div>
        <div class="f03-q" id="f03-q2" style="left: 900px; top: 420px; width: 130px; height: 176px">
          <svg viewBox="5 3 14 19" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M8.2 8.4a3.9 3.9 0 1 1 5.4 3.6c-1.1.5-1.6 1.3-1.6 2.4v1" /><circle cx="12" cy="19.4" r="0.6" fill="currentColor" /></svg>
        </div>
        <div class="f03-q" id="f03-q3" style="left: 0px; top: 1500px; width: 190px; height: 257px">
          <svg viewBox="5 3 14 19" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M8.2 8.4a3.9 3.9 0 1 1 5.4 3.6c-1.1.5-1.6 1.3-1.6 2.4v1" /><circle cx="12" cy="19.4" r="0.6" fill="currentColor" /></svg>
        </div>
        <div class="f03-q" id="f03-q4" style="left: 830px; top: 1580px; width: 220px; height: 298px">
          <svg viewBox="5 3 14 19" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M8.2 8.4a3.9 3.9 0 1 1 5.4 3.6c-1.1.5-1.6 1.3-1.6 2.4v1" /><circle cx="12" cy="19.4" r="0.6" fill="currentColor" /></svg>
        </div>
        <div class="f03-q" id="f03-q5" style="left: 940px; top: 1040px; width: 110px; height: 149px">
          <svg viewBox="5 3 14 19" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M8.2 8.4a3.9 3.9 0 1 1 5.4 3.6c-1.1.5-1.6 1.3-1.6 2.4v1" /><circle cx="12" cy="19.4" r="0.6" fill="currentColor" /></svg>
        </div>

        <div id="f03-disc">
          <div id="f03-core">
            <span class="f03-t" id="f03-why">Why</span>
            <span class="f03-t" id="f03-qm">?</span>
          </div>
        </div>
      </div>

      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          // Laptop shot keeps pushing in underneath (continues f02)
          tl.fromTo("#f03-vidwrap", { scale: 1.04 }, { scale: 1.06, duration: 0.66, ease: "none" }, 0);
          // Cream flood grows out of the disc and fills the frame (always ahead of the burned disc)
          tl.fromTo("#f03-fill", { scale: 1 }, { scale: 2.5, duration: 0.36, ease: "power1.in" }, 0);
          tl.fromTo("#f03-glow", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 0.34);
          // Disc halo tints pink once on cream; whole disc breathes
          tl.fromTo("#f03-disc", { backgroundColor: "rgba(255,255,255,0.6)" }, { backgroundColor: "rgba(247,207,212,0.45)", duration: 0.3, ease: "power1.out" }, 0.3);
          tl.fromTo("#f03-disc", { scale: 1 }, { scale: 1.04, duration: 1.2, ease: "sine.inOut" }, 0.3);
          // "Why ?" settles to full red on the VO hit (why @ local 0.07)
          tl.fromTo("#f03-why", { opacity: 0.55, y: 10 }, { opacity: 1, y: 0, duration: 0.28, ease: "power2.out" }, 0.0);
          tl.fromTo("#f03-qm", { opacity: 0, scale: 0.4, rotation: -25 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.4, ease: "back.out(2.2)" }, 0.1);
          tl.to("#f03-qm", { rotation: 10, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0.55);
          // Soft red question marks drift at the edges
          const drift = [
            ["#f03-q1", 0.36, -18, -40, -12],
            ["#f03-q2", 0.42, 14, -50, 16],
            ["#f03-q3", 0.38, 10, -60, 10],
            ["#f03-q4", 0.46, -12, -45, -14],
            ["#f03-q5", 0.5, 8, -35, 20],
          ];
          drift.forEach(([sel, t, dx, dy, rot]) => {
            tl.fromTo(sel, { opacity: 0, x: 0, y: 30, rotation: 0 }, { opacity: 0.6, x: dx, y: dy, rotation: rot, duration: 1.5 - t, ease: "sine.out" }, t);
          });

          window.__timelines["f03"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
