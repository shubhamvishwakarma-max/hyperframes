<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:'Geist';src:url(fonts/geist.woff2) format('woff2');font-weight:100 900;}
@font-face{font-family:'Hedvig';src:url(fonts/hedvig.woff2) format('woff2');}
:root{--cream:#F4F3EC;--ink:#131316;--green:#27B578;--deep:#007A5A;--mint:#E5FFEF;--grey:#70707B;--line:#E4E2D8;--coral:#C8665A;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1080px;overflow:hidden;background:#F7F5EF}
#stage{position:relative;width:1080px;height:1080px;overflow:hidden;background:#F7F5EF;font-family:Geist,sans-serif;color:var(--ink)}
.abs{position:absolute;will-change:transform,opacity}
.serif{text-wrap:balance;font-family:Hedvig,Georgia,serif;font-weight:400;letter-spacing:-0.02em}
.center{text-align:center}
.card{background:#FFFFFF;border-radius:22px;box-shadow:0 1px 0 rgba(19,19,22,.04),0 10px 30px rgba(60,50,30,.08);border:1px solid rgba(19,19,22,.06)}
.chip{background:#fff;border-radius:16px;box-shadow:0 8px 22px rgba(80,40,30,.10);border:1px solid rgba(19,19,22,.06);display:flex;align-items:center;gap:10px;padding:0 14px;font-size:17px;font-weight:500;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%}
.pill{display:inline-flex;align-items:center;gap:8px;border-radius:999px;font-weight:600;white-space:nowrap}
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;color:#fff;flex:none}
#subs{text-wrap:balance;position:absolute;left:70px;right:70px;bottom:34px;text-align:center;font:500 28px/1.32 Geist;color:#131316;text-shadow:0 0 6px rgba(247,245,239,.95),0 0 2px rgba(247,245,239,1)}
svg{overflow:visible}
</style></head>
<body><div id="stage"></div>
<script>
const W=1080,H=1080;
const S=document.getElementById('stage');
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,k)=>a+(b-a)*k;
const E={
  lin:x=>x,
  out:x=>1-Math.pow(1-x,3),
  out5:x=>1-Math.pow(1-x,5),
  inOut:x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,
  in:x=>x*x*x,
  back:x=>{const c1=1.5,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)},
};
const P=(t,a,d,e=E.out)=>e(clamp((t-a)/d));
// window envelope: fade in at a over fi, fade out ending at b over fo
const win=(t,a,b,fi=.35,fo=.3)=>Math.min(clamp((t-a)/fi),clamp((b-t)/fo));
function el(parent,cls,html,css){const d=document.createElement('div');d.className=cls||'';if(html!=null)d.innerHTML=html;if(css)Object.assign(d.style,css);(parent||S).appendChild(d);return d;}
function set(e,{o=1,x=0,y=0,s=1,r=0,blur=0}={}){e.style.opacity=o;e.style.transform=`translate(${x}px,${y}px) scale(${s}) rotate(${r}deg)`;e.style.filter=blur>0.05?`blur(${blur}px)`:'none';}
const px=v=>v+'px';
function box(parent,cls,html,l,t,w,h,css={}){return el(parent,'abs '+cls,html,Object.assign({left:px(l),top:px(t),width:w==null?'auto':px(w),height:h==null?'auto':px(h)},css));}

// ---------- icons ----------
const I={
 pin:(c='#C8665A')=>`<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.6"/></svg>`,
 clinic:(c='#C8665A')=>`<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V8l8-5 8 5v13"/><path d="M9 21v-5h6v5"/><path d="M12 8v5M9.5 10.5h5"/></svg>`,
 chat:(c='#27B578',s=20)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 11.5a8.5 8.5 0 0 1-12.6 7.4L3.5 20l1.2-4.2A8.5 8.5 0 1 1 20.5 11.5z"/></svg>`,
 cal:(c='#B7791F',s=20)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.2" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>`,
 clock:(c='#C8665A',s=20)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>`,

 dticks:(c='#53BDEB',s=20)=>`<svg width="${s}" height="${s*0.7}" viewBox="0 0 24 16" fill="none" stroke="${c}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 8.5l4 4L13 4"/><path d="M9.5 12.5L17 4"/><path d="M7.5 10.5"/></svg>`,
 eyeoff:(c='#C8665A',s=18)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.2" stroke-linecap="round"><path d="M3 3l18 18"/><path d="M10.6 5.1A10 10 0 0 1 12 5c6 0 9.5 7 9.5 7a17 17 0 0 1-3 3.8M6.6 6.6A16.5 16.5 0 0 0 2.5 12S6 19 12 19a9.7 9.7 0 0 0 4.2-1"/></svg>`,
 eye:(c='#007A5A',s=26)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round"><path d="M2.5 12S6 5 12 5s9.5 7 9.5 7-3.5 7-9.5 7S2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></svg>`,
 sliders:(c='#007A5A',s=26)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>`,
 bolt:(c='#007A5A',s=16)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="${c}"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>`,
 search:(c='#9A9AA3',s=18)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>`,
 dtmark:(s=28)=>`<svg width="${s}" height="${s*0.62}" viewBox="0 0 34 21" fill="none" stroke="#27B578" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 11l6 6L20 4"/><path d="M14 17L27 4"/></svg>`,
 verified:(s=20)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24"><path fill="#27B578" d="M12 1.5l2.6 1.9 3.2-.2 1 3 2.7 1.8-.9 3.1.9 3.1-2.7 1.8-1 3-3.2-.2L12 22.5l-2.6-1.9-3.2.2-1-3-2.7-1.8.9-3.1-.9-3.1 2.7-1.8 1-3 3.2.2z"/><path d="M7.5 12.2l3 3 6-6.2" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
};

// ---------- layers ----------
const tint=el(S,'abs',null,{left:0,top:0,width:'1080px',height:'1080px',background:'radial-gradient(120% 90% at 50% 38%, #FFFFFF 0%, #FBEFEC 46%, #F3D3CC 100%)'});
const cream=el(S,'abs',null,{left:0,top:0,width:'1080px',height:'1080px',background:'radial-gradient(110% 80% at 50% 35%, #FBFAF6 0%, #F4F3EC 70%, #ECEADF 100%)',opacity:0});

// ===== SCENE 1 =====
const s1=box(S,'','',0,0,W,H);
const s1logo=box(s1,'',`<img src="lavida.png" style="height:64px;display:block;margin:0 auto">`,0,44,W,70);
const s1h1=box(s1,'serif center','6 locations.',0,124,W,null,{fontSize:'86px',lineHeight:'1'});
const s1h2=box(s1,'serif center','Too many patient conversations<br>to track clearly.',0,226,W,null,{fontSize:'44px',lineHeight:'1.15',color:'#3A2E2C'});
const clinics=[];
const gridX=[115,405,695],gridY=[430,566];
const counts=[3,7,5,12,4,9];
for(let i=0;i<6;i++){
  const c=box(s1,'card',`<div style="display:flex;align-items:center;gap:14px;height:100%;padding:0 18px">

   gridX[i%3],gridY[Math.floor(i/3)],270,104);

 [I.chat('#27B578'),'New enquiry · unread',  70, 690,-3],
 [I.cal('#B7791F'),'Reminder not sent',     370, 716, 2],
 [I.clock(),'Follow-up overdue',            690, 688,-2],
 [I.chat('#27B578'),'“Can I reschedule?”',  160, 800, 2.5],
 [I.clock(),'No reply · 2 days',            470, 822,-1.5],
 [I.chat('#27B578'),'Price enquiry',        760, 796, 3],
 [I.cal('#B7791F'),'Who’s following up?',   300, 358,-2],
 [I.chat('#27B578'),'Missed message',       620, 352, 2],
];
const chips=chipDefs.map(([ic,tx,x,y,r])=>box(s1,'chip',`${ic}<span>${tx}</span><span class="dot" style="background:#D9604F;margin-left:2px"></span>`,x,y,null,52));

// ===== SCENE 2 =====
const s2=box(S,'','',0,0,W,H);
const s2h=box(s2,'serif center','Scattered chats.<br>Scattered follow-ups.',0,78,W,null,{fontSize:'66px',lineHeight:'1.08'});
const s2sub=box(s2,'center','Patients&nbsp;&nbsp;·&nbsp;&nbsp;Appointments&nbsp;&nbsp;·&nbsp;&nbsp;Teams',0,242,W,null,{fontSize:'23px',color:'#70707B',fontWeight:'500',letterSpacing:'0.02em'});
const admin=box(s2,'card',`<div style="display:flex;align-items:center;gap:16px;height:100%;padding:0 22px">
 <div class="av" style="width:56px;height:56px;background:#3A3A40;font-size:20px">CA</div>
 <div style="flex:1"><div style="font-weight:600;font-size:23px">Clinic Admin</div><div style="font-size:16px;color:#70707B;margin-top:3px">Monitoring 6 inboxes</div></div></div>`,300,318,480,100);

 ['Patient 01','Appointment follow-up pending','#E0A33A','Clinic 02'],

 ['Patient 04','Lead not contacted','#D9604F','Clinic 04'],
];
const patPos=[[110,560],[570,560],[110,720],[570,720]];
const s2svg=box(s2,'','<svg width="1080" height="1080" id="s2lines"></svg>',0,0,W,H);
const pats=patDefs.map(([n,iss,col,cl],i)=>box(s2,'card',`<div style="display:flex;align-items:center;gap:16px;height:100%;padding:0 20px">
 <div class="av" style="width:52px;height:52px;background:#B9B4AA;font-size:18px">P${i+1}</div>
 <div style="flex:1;min-width:0"><div style="display:flex;align-items:center;gap:10px"><span style="font-weight:600;font-size:21px">${n}</span><span style="font-size:13px;color:#70707B;background:#F1EFE8;border-radius:6px;padding:2px 7px">${cl}</span></div>
 <div style="font-size:17px;color:#4A4A52;margin-top:5px;display:flex;align-items:center;gap:8px"><span class="dot pdot" style="background:${col}"></span>${iss}</div></div></div>`,patPos[i][0],patPos[i][1],400,116));
// weak lines from admin to patients
const s2l=document.getElementById('s2lines');
s2l.innerHTML=patPos.map(([x,y],i)=>{const sx=540+(i%2?60:-60),sy=418,ex=x+200,ey=y;return `<path class="wl" d="M${sx} ${sy} C ${sx} ${sy+80}, ${ex} ${ey-80}, ${ex} ${ey}" stroke="#C9A39C" stroke-width="2" fill="none" stroke-dasharray="6 9"/>`}).join('')+
 `<line id="sweep" x1="0" y1="0" x2="0" y2="0" stroke="#27B578" stroke-width="5" stroke-linecap="round"/><line id="sweep2" x1="0" y1="0" x2="0" y2="0" stroke="#27B578" stroke-width="5" stroke-linecap="round"/><circle id="hub" cx="540" cy="640" r="10" fill="#27B578"/>`;
const wls=[...s2l.querySelectorAll('.wl')];
const sweep=s2l.querySelector('#sweep'),sweep2=s2l.querySelector('#sweep2'),hub=s2l.querySelector('#hub');

// ===== SCENE 3 =====
const s3=box(S,'','',0,0,W,H);
const s3h=box(s3,'serif center','That’s where DoubleTick<br>stepped in.',0,86,W,null,{fontSize:'66px',lineHeight:'1.08'});
const s3svg=box(s3,'','<svg width="1080" height="1080" id="s3lines"></svg>',0,0,W,H);
const ringC=[540,610];
const ring=[...Array(6)].map((_,i)=>{const a=-Math.PI/2+i*Math.PI/3+Math.PI/6; return [ringC[0]+Math.cos(a)*395,ringC[1]+Math.sin(a)*235];});
const s3l=document.getElementById('s3lines');
s3l.innerHTML=ring.map(([x,y],i)=>`<path class="gl" d="M${x} ${y} Q ${lerp(x,ringC[0],.5)+(i%2?40:-40)} ${lerp(y,ringC[1],.5)}, ${ringC[0]} ${ringC[1]}" stroke="#27B578" stroke-width="2.5" fill="none" stroke-linecap="round" opacity=".55"/>`).join('');
const gls=[...s3l.querySelectorAll('.gl')];
const glLen=gls.map(p=>p.getTotalLength());
gls.forEach((p,i)=>{p.style.strokeDasharray=glLen[i];});
const packets=[...Array(12)].map((_,i)=>box(s3,'',`<div style="width:38px;height:38px;border-radius:12px;background:#fff;box-shadow:0 6px 16px rgba(0,80,50,.18);display:flex;align-items:center;justify-content:center">${I.chat('#27B578',20)}</div>`,0,0,38,38));
const crm=box(S,'card',`<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:10px">
 <div style="display:flex;align-items:center;gap:8px;font-size:17px;font-weight:600;color:#007A5A;background:#E5FFEF;border-radius:999px;padding:6px 14px">${I.dtmark(24)}DoubleTick</div>
 <div style="font-weight:600;font-size:31px;letter-spacing:-0.01em">Unified WhatsApp CRM</div>
 <div style="font-size:17px;color:#70707B">All conversations · 6 clinics · 1 view</div></div>`,330,510,420,200,{borderRadius:'26px',boxShadow:'0 0 0 1px rgba(39,181,120,.25), 0 18px 50px rgba(0,122,90,.16)'});
// shared clinic pills (scene 3 ring -> scene 4 row)
const cpills=[...Array(6)].map((_,i)=>box(S,'pill',`<span style="width:26px;height:26px;border-radius:8px;background:#E5FFEF;display:flex;align-items:center;justify-content:center">${I.clinic('#007A5A').replace(/28/g,'18')}</span>Clinic 0${i+1}`,0,0,140,44,{background:'#fff',fontSize:'17px',padding:'0 12px',boxShadow:'0 6px 16px rgba(60,50,30,.10)',border:'1px solid rgba(19,19,22,.06)',justifyContent:'center'}));
const rowPos=[...Array(6)].map((_,i)=>[90+i*150,262]);

// ===== SCENE 4 =====
const s4=box(S,'','',0,0,W,H);
const s4num=box(s4,'serif center','',0,50,W,null,{fontSize:'118px',lineHeight:'1'});
const s4sub=box(s4,'serif center','patient leads. <span style="color:#007A5A">One unified WhatsApp CRM.</span>',0,176,W,null,{fontSize:'38px'});

const rls=[...s4l.querySelectorAll('.rl')];const rlLen=rls.map(p=>p.getTotalLength());rls.forEach((p,i)=>p.style.strokeDasharray=rlLen[i]);
const dash=box(S,'card','',170,366,740,524,{borderRadius:'24px',overflow:'hidden'});
const dashIn=el(dash,'',`
 <div style="height:78px;display:flex;align-items:center;gap:12px;padding:0 24px;border-bottom:1px solid #EEEDE6">
   ${I.dtmark(28)}<div style="font-weight:600;font-size:23px;flex:1">All Patient Conversations</div>
   <div style="display:flex;align-items:center;gap:8px;font-size:15px;color:#4A4A52;border:1px solid #E4E2D8;border-radius:10px;padding:7px 12px">${I.search()}Search</div>
   <div style="font-size:15px;font-weight:600;color:#007A5A;background:#E5FFEF;border-radius:10px;padding:8px 12px">All 6 clinics ▾</div>
 </div>`,{});
const rowDefs=[
 ['AK','#C97B63','Aisha Khan','Consultation enquiry','Clinic 01','2m',2],
 ['FN','#7A8F6B','Fatima Noor','Appointment follow-up','Clinic 03','5m',1],
 ['RS','#8C7BA8','Riya Sharma','Reschedule request','Clinic 05','9m',3],

];
const rows=rowDefs.map(([ini,col,n,m,cl,tm,u],i)=>box(dash,'',`<div style="display:flex;align-items:center;gap:16px;height:100%;padding:0 24px;border-bottom:1px solid #F1F0EA">

 <div style="font-size:13px;color:#4A4A52;background:#F1EFE8;border-radius:6px;padding:3px 8px">${cl}</div>
 <div style="width:56px;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:6px"><span style="font-size:14px;color:#27B578;font-weight:600">${tm}</span><span style="width:24px;height:24px;border-radius:50%;background:#27B578;color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center">${u}</span></div>
 </div>`,0,78+i*96,740,96));
const dashFoot=box(dash,'',`<div style="display:flex;align-items:center;gap:10px;height:100%;padding:0 24px;font-size:16px;color:#007A5A;font-weight:600;background:#FAFDF9"><span class="dot" style="background:#27B578;width:9px;height:9px"></span>6 clinics connected · Live<span style="flex:1"></span><span style="color:#70707B;font-weight:500">Assigned · Tagged · Tracked</span></div>`,0,462,740,62);

// ===== SCENE 5 =====

const wa=box(s5,'card','',270,250,540,640,{borderRadius:'28px',overflow:'hidden'});
el(wa,'',`<div style="height:84px;display:flex;align-items:center;gap:14px;padding:0 22px;background:#fff;border-bottom:1px solid #EEEDE6">

  <div style="position:absolute;top:84px;left:0;right:0;bottom:0;background:#EFEAE0"></div>`);
const waBody=box(wa,'','',0,84,540,556);
const waDay=box(waBody,'center',`<span style="background:#fff;border-radius:8px;padding:4px 10px;font-size:13px;color:#70707B">Today</span>`,0,20,540,null);
const waMsg=box(waBody,'',`<div style="background:#fff;border-radius:4px 18px 18px 18px;padding:16px 18px 10px;box-shadow:0 1px 2px rgba(0,0,0,.06)">
  <div style="font-size:20px;line-height:1.42;color:#131316">Hi Aisha, this is a reminder for your appointment <b style="font-weight:600">tomorrow at 4:00 PM</b>. Please confirm.</div>
  <div style="text-align:right;font-size:12px;color:#8A8A93;margin-top:4px">10:02</div></div>`,24,62,400,null);
