<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:'Geist';src:url(fonts/geist.woff2) format('woff2');font-weight:100 900;}
@font-face{font-family:'Roboto';src:url(fonts/roboto.woff2) format('woff2');font-weight:100 900;}
@font-face{font-family:'Hedvig';src:url(fonts/hedvig.woff2) format('woff2');}
:root{--cream:#F4F3EC;--ink:#131316;--green:#27B578;--deep:#007A5A;--mint:#E5FFEF;--grey:#70707B;--line:#E4E2D8;--coral:#C8665A;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow:hidden;background:#F7F5EF}
#canvas{position:relative;overflow:hidden;background:#F7F5EF}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;width:1080px;height:1080px;overflow:visible;background:transparent;font-family:Geist,sans-serif;color:var(--ink)}
.abs{position:absolute;will-change:transform,opacity}
.serif{text-wrap:balance;font-family:Hedvig,Georgia,serif;font-weight:400;letter-spacing:-0.02em}
.center{text-align:center}
.card{background:#FFFFFF;border-radius:22px;box-shadow:0 1px 0 rgba(19,19,22,.04),0 10px 30px rgba(60,50,30,.08);border:1px solid rgba(19,19,22,.06)}
.chip{background:#fff;border-radius:16px;box-shadow:0 8px 22px rgba(80,40,30,.10);border:1px solid rgba(19,19,22,.06);display:flex;align-items:center;gap:10px;padding:0 14px;font-size:17px;font-weight:500;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%}
.pill{display:inline-flex;align-items:center;gap:8px;border-radius:999px;font-weight:600;white-space:nowrap}
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;color:#fff;flex:none}
#subs{text-wrap:balance;position:absolute;left:70px;right:70px;bottom:34px;max-width:1200px;margin:0 auto;text-align:center;font:500 28px/1.32 Geist;color:#131316;text-shadow:0 0 6px rgba(247,245,239,.95),0 0 2px rgba(247,245,239,1)}
svg{overflow:visible}
</style></head>
<body><div id="canvas"><div id="stage"></div></div>
<script>
const W=1080,H=1080;
const S=document.getElementById('stage');
// ---- output format: sq 1080x1080, portrait 1080x1350, land 1920x1080, wide 1280x628 (laid out at 2201x1080, rendered at 0.5815x)
const FMT=new URLSearchParams(location.search).get('fmt')||'sq';
const [CW,CH]={sq:[1080,1080],portrait:[1080,1350],land:[1920,1080],wide:[2201,1080],vert:[1080,1920]}[FMT];
const STACK=FMT==='vert';
const SPLIT=FMT==='land'||FMT==='wide';
const CV=document.getElementById('canvas');
Object.assign(CV.style,{width:CW+'px',height:CH+'px'});Object.assign(document.body.style,{width:CW+'px',height:CH+'px'});
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,k)=>a+(b-a)*k;
const E={
  lin:x=>x,
  out:x=>1-Math.pow(1-x,3),
  out5:x=>1-Math.pow(1-x,5),
  inOut:x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,
  in:x=>x*x*x,
  back:x=>{const c1=1.5,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)},
};
const P=(t,a,d,e=E.out)=>e(clamp((t-a)/d));
// window envelope: fade in at a over fi, fade out ending at b over fo
const win=(t,a,b,fi=.35,fo=.3)=>Math.min(clamp((t-a)/fi),clamp((b-t)/fo));
function el(parent,cls,html,css){const d=document.createElement('div');d.className=cls||'';if(html!=null)d.innerHTML=html;if(css)Object.assign(d.style,css);(parent||S).appendChild(d);return d;}
function set(e,{o=1,x=0,y=0,s=1,r=0,blur=0}={}){e.style.opacity=o;e.style.transform=`translate(${x}px,${y}px) scale(${s}) rotate(${r}deg)`;e.style.filter=blur>0.05?`blur(${blur}px)`:'none';}
const px=v=>v+'px';
function box(parent,cls,html,l,t,w,h,css={}){return el(parent,'abs '+cls,html,Object.assign({left:px(l),top:px(t),width:w==null?'auto':px(w),height:h==null?'auto':px(h)},css));}

// ---------- icons ----------
const I={
 pin:(c='#C8665A')=>`<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.6"/></svg>`,
 clinic:(c='#C8665A')=>`<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V8l8-5 8 5v13"/><path d="M9 21v-5h6v5"/><path d="M12 8v5M9.5 10.5h5"/></svg>`,
 chat:(c='#27B578',s=20)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 11.5a8.5 8.5 0 0 1-12.6 7.4L3.5 20l1.2-4.2A8.5 8.5 0 1 1 20.5 11.5z"/></svg>`,
 cal:(c='#B7791F',s=20)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.2" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>`,
 clock:(c='#C8665A',s=20)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>`,
 check:(c='#fff',s=16,w=3)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`,
 dticks:(c='#53BDEB',s=20)=>`<svg width="${s}" height="${s*0.7}" viewBox="0 0 24 16" fill="none" stroke="${c}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 8.5l4 4L13 4"/><path d="M9.5 12.5L17 4"/><path d="M7.5 10.5"/></svg>`,
 eyeoff:(c='#C8665A',s=18)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.2" stroke-linecap="round"><path d="M3 3l18 18"/><path d="M10.6 5.1A10 10 0 0 1 12 5c6 0 9.5 7 9.5 7a17 17 0 0 1-3 3.8M6.6 6.6A16.5 16.5 0 0 0 2.5 12S6 19 12 19a9.7 9.7 0 0 0 4.2-1"/></svg>`,
 eye:(c='#007A5A',s=26)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round"><path d="M2.5 12S6 5 12 5s9.5 7 9.5 7-3.5 7-9.5 7S2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></svg>`,
 sliders:(c='#007A5A',s=26)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>`,
 bolt:(c='#007A5A',s=16)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="${c}"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>`,
 search:(c='#9A9AA3',s=18)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>`,
 dtmark:(s=28)=>`<svg width="${s}" height="${s*0.62}" viewBox="0 0 34 21" fill="none" stroke="#27B578" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 11l6 6L20 4"/><path d="M14 17L27 4"/></svg>`,
 verified:(s=20)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24"><path fill="#27B578" d="M12 1.5l2.6 1.9 3.2-.2 1 3 2.7 1.8-.9 3.1.9 3.1-2.7 1.8-1 3-3.2-.2L12 22.5l-2.6-1.9-3.2.2-1-3-2.7-1.8.9-3.1-.9-3.1 2.7-1.8 1-3 3.2.2z"/><path d="M7.5 12.2l3 3 6-6.2" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
};

// ---------- layers ----------
const tint=el(CV,'abs',null,{left:0,top:0,width:CW+'px',height:CH+'px',background:'radial-gradient(120% 90% at 50% 38%, #FFFFFF 0%, #FBEFEC 46%, #F3D3CC 100%)'});
const cream=el(CV,'abs',null,{left:0,top:0,width:CW+'px',height:CH+'px',background:'radial-gradient(110% 80% at 50% 35%, #FBFAF6 0%, #F4F3EC 70%, #ECEADF 100%)',opacity:0});
CV.insertBefore(tint,S);CV.insertBefore(cream,S);

// ===== SCENE 1 =====
const s1=box(S,'','',0,0,W,H);
const s1logo=box(s1,'','',0,0,0,0);
const s1h1=box(s1,'serif center','<span style="color:#D32F2F">6 locations.</span>',0,140,W,null,{fontSize:'86px',lineHeight:'1'});
const s1h2=box(s1,'serif center','<span style="color:#D32F2F">Too many</span> patient conversations<br>to track clearly.',0,242,W,null,{fontSize:'44px',lineHeight:'1.15',color:'#3A2E2C'});
const clinics=[];
const gridX=[115,405,695],gridY=[430,566];
const counts=[3,7,5,12,4,9];
for(let i=0;i<6;i++){
  const c=box(s1,'card',`<div style="display:flex;align-items:center;gap:14px;height:100%;padding:0 18px">
   <div style="width:52px;height:52px;border-radius:14px;background:#FBE9E5;display:flex;align-items:center;justify-content:center">${I.clinic()}</div>
   <div style="flex:1;white-space:nowrap"><div style="font-weight:600;font-size:23px">Clinic 0${i+1}</div><div style="font-size:16px;color:#70707B;margin-top:2px">Dubai</div></div>
   <div class="badge" style="min-width:34px;height:34px;padding:0 9px;border-radius:999px;background:#D9604F;color:#fff;font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center">0</div></div>`,
   gridX[i%3],gridY[Math.floor(i/3)],270,104);
  clinics.push(c);
}
const chipDefs=[
 [I.chat('#27B578'),'New enquiry · unread',  70, 690,-3],
 [I.cal('#B7791F'),'Reminder not sent',     370, 716, 2],
 [I.clock(),'Follow-up overdue',            690, 688,-2],
 [I.chat('#27B578'),'“Can I reschedule?”',  160, 800, 2.5],
 [I.clock(),'No reply · 2 days',            470, 822,-1.5],
 [I.chat('#27B578'),'Price enquiry',        760, 796, 3],
 [I.cal('#B7791F'),'Who’s following up?',   300, 368,-2],
 [I.chat('#27B578'),'Missed message',       620, 364, 2],
];
const chips=chipDefs.map(([ic,tx,x,y,r])=>box(s1,'chip',`${ic}<span>${tx}</span><span class="dot" style="background:#D9604F;margin-left:2px"></span>`,x,y,null,52));

// ===== SCENE 2 =====
const s2=box(S,'','',0,0,W,H);
const s2h=box(s2,'serif center','<span style="color:#D32F2F">Scattered</span> chats.<br><span style="color:#D32F2F">Scattered</span> follow-ups.',0,96,W,null,{fontSize:'66px',lineHeight:'1.08'});
const s2sub=box(s2,'center','',0,242,W,null,{fontSize:'23px',color:'#70707B',fontWeight:'500',letterSpacing:'0.02em'});
const admin=box(s2,'card',`<div style="display:flex;align-items:center;gap:16px;height:100%;padding:0 22px">
 <div class="av" style="width:56px;height:56px;background:#3A3A40;font-size:20px">CA</div>
 <div style="flex:1"><div style="font-weight:600;font-size:23px">Clinic Admin</div><div style="font-size:16px;color:#70707B;margin-top:3px">Monitoring 6 inboxes</div></div></div>`,300,318,480,100);
const vis=box(s2,'pill',`${I.eyeoff()}Limited visibility`,580,300,null,40,{background:'#FBE3DE',color:'#B4493B',fontSize:'17px',padding:'0 16px',boxShadow:'0 4px 14px rgba(180,73,59,.18)'});
const patDefs=[
 ['Patient 01','Appointment follow-up pending','#E0A33A','Clinic 02'],
 ['Patient 02','Enquiry waiting','#D9604F','Clinic 05'],
 ['Patient 03','Reschedule requested','#E0A33A','Clinic 01'],
 ['Patient 04','Lead not contacted','#D9604F','Clinic 04'],
];
const patPos=[[110,560],[570,560],[110,720],[570,720]];
const s2svg=box(s2,'','<svg width="1080" height="1080" id="s2lines"></svg>',0,0,W,H);
const pats=patDefs.map(([n,iss,col,cl],i)=>box(s2,'card',`<div style="display:flex;align-items:center;gap:16px;height:100%;padding:0 20px">
 <div class="av" style="width:52px;height:52px;background:#B9B4AA;font-size:18px">P${i+1}</div>
 <div style="flex:1;min-width:0"><div style="display:flex;align-items:center;gap:10px"><span style="font-weight:600;font-size:21px">${n}</span><span style="font-size:13px;color:#70707B;background:#F1EFE8;border-radius:6px;padding:2px 7px">${cl}</span></div>
 <div style="font-size:17px;color:#4A4A52;margin-top:5px;display:flex;align-items:center;gap:8px"><span class="dot pdot" style="background:${col}"></span>${iss}</div></div></div>`,patPos[i][0],patPos[i][1],400,116));
// weak lines from admin to patients
const s2l=document.getElementById('s2lines');
s2l.innerHTML=patPos.map(([x,y],i)=>{const sx=540+(i%2?60:-60),sy=418,ex=x+200,ey=y;return `<path class="wl" d="M${sx} ${sy} C ${sx} ${sy+80}, ${ex} ${ey-80}, ${ex} ${ey}" stroke="#C9A39C" stroke-width="2" fill="none" stroke-dasharray="6 9"/>`}).join('')+
 `<line id="sweep" x1="0" y1="0" x2="0" y2="0" stroke="#27B578" stroke-width="5" stroke-linecap="round"/><line id="sweep2" x1="0" y1="0" x2="0" y2="0" stroke="#27B578" stroke-width="5" stroke-linecap="round"/><circle id="hub" cx="540" cy="640" r="10" fill="#27B578"/>`;
const wls=[...s2l.querySelectorAll('.wl')];
const sweep=s2l.querySelector('#sweep'),sweep2=s2l.querySelector('#sweep2'),hub=s2l.querySelector('#hub');

// ===== SCENE 3 =====
const s3=box(S,'','',0,0,W,H);
const s3h=box(s3,'serif center','That’s where DoubleTick<br>stepped in.',0,102,W,null,{fontSize:'66px',lineHeight:'1.08'});
const s3svg=box(s3,'','<svg width="1080" height="1080" id="s3lines"></svg>',0,0,W,H);
const ringC=[540,610];
const ring=[...Array(6)].map((_,i)=>{const a=-Math.PI/2+i*Math.PI/3+Math.PI/6; return [ringC[0]+Math.cos(a)*395,ringC[1]+Math.sin(a)*235];});
const s3l=document.getElementById('s3lines');
s3l.innerHTML=ring.map(([x,y],i)=>`<path class="gl" d="M${x} ${y} Q ${lerp(x,ringC[0],.5)+(i%2?40:-40)} ${lerp(y,ringC[1],.5)}, ${ringC[0]} ${ringC[1]}" stroke="#27B578" stroke-width="2.5" fill="none" stroke-linecap="round" opacity=".55"/>`).join('');
const gls=[...s3l.querySelectorAll('.gl')];
const glLen=gls.map(p=>p.getTotalLength());
gls.forEach((p,i)=>{p.style.strokeDasharray=glLen[i];});
const packets=[...Array(12)].map((_,i)=>box(s3,'',`<div style="width:38px;height:38px;border-radius:12px;background:#fff;box-shadow:0 6px 16px rgba(0,80,50,.18);display:flex;align-items:center;justify-content:center">${I.chat('#27B578',20)}</div>`,0,0,38,38));
const crm=box(S,'card',`<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:10px">
 <div style="display:flex;align-items:center;gap:8px;font-size:17px;font-weight:600;color:#007A5A;background:#E5FFEF;border-radius:999px;padding:6px 14px">${I.dtmark(24)}DoubleTick</div>
 <div style="font-weight:600;font-size:31px;letter-spacing:-0.01em">Unified WhatsApp CRM</div>
 <div style="font-size:17px;color:#70707B">All conversations · 6 clinics · 1 view</div></div>`,330,510,420,200,{borderRadius:'26px',boxShadow:'0 0 0 1px rgba(39,181,120,.25), 0 18px 50px rgba(0,122,90,.16)'});
// shared clinic pills (scene 3 ring -> scene 4 row)
const cpills=[...Array(6)].map((_,i)=>box(S,'pill',`<span style="width:26px;height:26px;border-radius:8px;background:#E5FFEF;display:flex;align-items:center;justify-content:center">${I.clinic('#007A5A').replace(/28/g,'18')}</span>Clinic 0${i+1}`,0,0,140,44,{background:'#fff',fontSize:'17px',padding:'0 12px',boxShadow:'0 6px 16px rgba(60,50,30,.10)',border:'1px solid rgba(19,19,22,.06)',justifyContent:'center'}));
const rowPos=[...Array(6)].map((_,i)=>[90+i*150,278]);

// ===== SCENE 4 =====
const s4=box(S,'','',0,0,W,H);
const s4num=box(s4,'serif center','',0,58,W,null,{fontSize:'118px',lineHeight:'1'});
const odo4=makeOdo(s4num,[['30,000',''],['+','#27B578',true]],2);
const s4sub=box(s4,'serif center','patient leads. <span style="color:#007A5A">One unified WhatsApp CRM.</span>',0,192,W,null,{fontSize:'38px'});
const s4svg=box(s4,'','<svg width="1080" height="1080" id="s4lines"></svg>',0,0,W,H);
const s4l=document.getElementById('s4lines');
s4l.innerHTML=rowPos.map(([x,y])=>`<path class="rl" d="M${x+70} ${y+44} C ${x+70} ${y+80}, 540 ${y+60}, 540 392" stroke="#27B578" stroke-width="2.5" fill="none" stroke-linecap="round"/>`).join('');
const rls=[...s4l.querySelectorAll('.rl')];const rlLen=rls.map(p=>p.getTotalLength());rls.forEach((p,i)=>p.style.strokeDasharray=rlLen[i]);
// DoubleTick inbox (simplified from the real product UI) — runs to the bottom of the frame, fading into the beige
const DY=392,DW=1000,DH=1080-DY;
const dash=box(S,'','',40,DY,DW,DH,{background:'#fff',borderRadius:'20px 20px 0 0',overflow:'hidden',boxShadow:'0 0 0 1px rgba(19,19,22,.07), 0 18px 50px rgba(60,50,30,.10)',
  webkitMaskImage:'linear-gradient(to bottom,#000 0%,#000 50%,rgba(0,0,0,.04) 92%,rgba(0,0,0,.04) 100%)',maskImage:'linear-gradient(to bottom,#000 0%,#000 50%,rgba(0,0,0,.04) 92%,rgba(0,0,0,.04) 100%)'});
const ib=(c='#1F1F1F',s=17)=>({
  chev:`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>`,
  chevU:`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round"><path d="M6 15l6-6 6 6"/></svg>`,
  user:`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="10" r="3"/><path d="M6.5 18.5a7 7 0 0 1 11 0"/></svg>`,
  clock:`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 3h6"/></svg>`,
  unas:`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="10" r="3"/><path d="M4 4l16 16"/></svg>`,
  sort:`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16M3.5 7.5L7 4l3.5 3.5M17 20V4M13.5 16.5L17 20l3.5-3.5"/></svg>`,
  dots:`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="${c}"><circle cx="12" cy="5" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="12" cy="19" r="1.7"/></svg>`,
  phone:`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h3l2 5-2.5 1.5a11 11 0 0 0 6 6L15 14l5 2v3a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>`,
  q:`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.7M12 17h.01"/></svg>`,
  panel:`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="1.8"><rect x="3.5" y="4.5" width="17" height="15" rx="3"/><path d="M9 4.5v15"/></svg>`,
  inbox:`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-3-6.2"/><path d="M8.5 13.5h7"/><path d="M8.5 10h4"/></svg>`,
});
const wab=(s=14)=>`<span style="position:absolute;right:-2px;bottom:-2px;width:${s}px;height:${s}px;border-radius:50%;background:#25D366;border:2px solid #fff;display:flex;align-items:center;justify-content:center"></span>`;
const ticks2=`<svg width="16" height="11" viewBox="0 0 24 16" fill="none" stroke="#3BA1E8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 8.5l4 4L13 4"/><path d="M9.5 12.5L17 4"/></svg>`;

// ===== ODOMETER (number switching → settles on the result) =====
function makeOdo(host,parts,spinBase=2){
  host.innerHTML='';const digits=[];const extras=[];
  const LH=1.16;
  parts.forEach(([str,color,isSuffix])=>{for(const ch of str){
    if(/[0-9]/.test(ch)){
      const cell=document.createElement('span');
      Object.assign(cell.style,{position:'relative',display:'inline-block',height:LH+'em',lineHeight:LH+'em',verticalAlign:'top',overflow:'hidden',padding:'0 0.12em',margin:'0 -0.12em',webkitMaskImage:'linear-gradient(to bottom, transparent 0%, #000 16%, #000 97%, transparent 100%)',maskImage:'linear-gradient(to bottom, transparent 0%, #000 16%, #000 97%, transparent 100%)',color:color||''});
      cell.innerHTML=`<span style="visibility:hidden">${ch}</span>`;
      const col=document.createElement('span');Object.assign(col.style,{position:'absolute',left:'50%',top:'0',display:'flex',flexDirection:'column',alignItems:'center'});
      const n=digits.length,spins=spinBase+n,fin=+ch,total=spins*10+fin;
      col.innerHTML=[...Array(total+1)].map((_,k)=>`<span style="display:block;height:${LH}em;line-height:${LH}em">${k%10}</span>`).join('');
      cell.appendChild(col);host.appendChild(cell);digits.push({col,total});
    } else {
      const sp=document.createElement('span');Object.assign(sp.style,{display:'inline-block',height:LH+'em',lineHeight:LH+'em',verticalAlign:'top',color:color||'',whiteSpace:'pre'});
      sp.textContent=ch;host.appendChild(sp);if(isSuffix)extras.push(sp);
    }}});
  const n=digits.length;
  return p=>{digits.forEach((d,i)=>{const f=0.55+0.45*(n>1?i/(n-1):1);const q=clamp(p/f);const pos=E.out(q)*d.total;
      d.col.style.transform=`translate(-50%,${-pos*LH}em)`;d.col.style.filter=q<0.97?`blur(${(1-q)*1.2}px)`:'none';});
    extras.forEach(e=>{e.style.opacity=P(p,0.85,0.15);});};
}

      if(i===1){n.style.background=act>0.5?'#007A5A':'#fff';n.querySelector('.ntx').style.color=act>0.5?'#fff':'#131316';n.querySelector('.nic').style.background=act>0.5?'#fff':'#E5FFEF';}});
    arrows.forEach((a,i)=>{const k=P(t,35.6+1.3*((i+0.5)/3),0.3,E.back);set(a,{o:clamp(k*2),s:0.5+0.5*k});});
    checks.forEach((c,i)=>{const st=36.7+i*0.16;set(c,{o:P(t,st,0.3),y:10*(1-P(t,st,0.4))});});
  }
  // ---- S9 (38.6-end)
  const on9=t>38.55; s9.style.display=on9?'block':'none';
  if(on9){
    set(s9logo,{o:P(t,38.65,0.4),y:10*(1-P(t,38.65,0.5))});
    set(s9h,{o:P(t,38.85,0.45),y:14*(1-P(t,38.85,0.6))});
    const k=P(t,39.25,0.7,E.back);
    const pulse=t>40.6?Math.sin(clamp((t-40.6)/0.5)*Math.PI):0;
    set(cta,{o:P(t,39.25,0.35),s:(0.96+0.04*k)*(1+0.035*pulse),y:8*(1-P(t,39.25,0.6))});
    const g=clamp((t-40.6)/0.9);set(ctaGlow,{o:t>40.6?(1-g)*0.8:0,s:1+0.12*E.out(g)});
    set(s9url,{o:P(t,39.7,0.4)});
    set(s9foot,{o:P(t,40.0,0.5)});
  }
  // ---- corner logos
  {const o=Math.min(P(t,-0.2,0.3),1-P(t,38.3,0.3));set(cornerDT,{o});set(cornerLV,{o});}
  // ---- subtitles
  let txt='',so=0;for(const [a,b,s] of CUES){if(t>=a-0.05&&t<b+0.12){txt=s;so=Math.min(clamp((t-a+0.05)/0.12),clamp((b+0.12-t)/0.12));}}
  if(subs.textContent!==txt)subs.textContent=txt; subs.style.opacity=so;
}
window.render=render;
window.ready=Promise.all([document.fonts.ready,...[...document.images].map(im=>im.complete?1:new Promise(r=>{im.onload=im.onerror=r}))]).then(()=>document.fonts.load('40px Hedvig')).then(()=>document.fonts.load('500 28px Geist')).then(()=>document.fonts.load('500 20px Roboto')).then(()=>{doLayout();return true;});
render(0);
</script></body></html>
